<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your First Flock — Chicken Care Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF8F0;
    --sky: #C5E3F0;
    --grass: #AED8B8;
    --grass-dk: #8CC09A;
    --wood: #F0E0CC;
    --wood-dk: #5C3D2E;
    --roof: #D4907A;
    --roof-dk: #B06850;
    --cream: #FDF8F0;
    --salmon: #E57373;
    --gold: #F4B840;
    --pink: #F0A0A0;
    --blue-btn: #8EC8D8;
    --green-btn: #8CC09A;
    --text: #4A3028;
    --text-muted: #8B7060;
    --outline: #4A3028;
    --radius: 18px;
    --radius-sm: 14px;
    --font-display: 'Baloo 2', cursive;
    --font-body: 'Nunito', sans-serif;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(240,160,160,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(142,200,216,0.08) 0%, transparent 50%);
  }
  .app { width:100%; max-width:960px; display:flex; flex-direction:column; min-height:100vh; }

  /* ── Header ─────────────────────────────────── */
  .header-bar {
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 28px; background:rgba(255,252,247,0.94);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:3px solid var(--outline);
    position:sticky; top:0; z-index:50; gap:16px; flex-wrap:wrap;
  }
  .logo-text {
    font-family:var(--font-display); font-weight:800; font-size:1.4rem;
    color:var(--text); letter-spacing:-0.3px;
  }
  .logo-text .accent { color:var(--salmon); }
  .header-stats { display:flex; gap:20px; align-items:center; }
  .hstat {
    display:flex; align-items:center; gap:6px;
    font-family:var(--font-body); font-weight:700; font-size:0.88rem; color:var(--text-muted);
  }
  .hstat .val {
    color:var(--text); font-family:var(--font-display); font-size:1.15rem;
  }
  .feed-pill {
    font-family:var(--font-body); font-weight:700; font-size:0.82rem;
    color:var(--text-muted); background:white;
    padding:6px 16px; border-radius:20px; border:2.5px solid var(--outline);
  }
  .feed-pill strong { color:var(--text); }

  /* ── Scene ──────────────────────────────────── */
  .scene-wrap { margin:20px 20px 12px; position:relative; }
  .scene-wrap svg {
    display:block; width:100%; background:var(--sky);
    border-radius:22px; border:3px solid var(--outline);
    box-shadow:0 6px 0 var(--outline), 0 8px 24px rgba(74,48,40,0.12);
  }
  .clickable { cursor:pointer; transition:transform 0.12s; }
  .clickable:hover { transform:scale(1.04); }
  .clickable:active { transform:scale(0.94); }

  /* ── Chicken Popup ──────────────────────────── */
  .chicken-popup {
    position:absolute; background:white; border-radius:var(--radius);
    padding:18px 22px; border:3px solid var(--outline);
    box-shadow:0 6px 0 var(--outline), 0 8px 28px rgba(74,48,40,0.18);
    z-index:25; min-width:200px; pointer-events:auto;
    font-family:var(--font-body);
  }
  .chicken-popup .pn {
    font-family:var(--font-display); font-weight:700; font-size:1.1rem;
    color:var(--text); margin-bottom:10px;
  }
  .chicken-popup .ps {
    display:flex; align-items:center; gap:8px;
    font-size:0.8rem; font-weight:700; color:var(--text-muted); margin-bottom:6px;
  }
  .chicken-popup .pb {
    flex:1; height:8px; background:#F0E8DD; border-radius:4px;
    border:2px solid var(--outline); overflow:hidden;
  }
  .chicken-popup .pbf { height:100%; border-radius:2px; transition:width 0.4s; }
  .pbf.h { background:var(--green-btn); } .pbf.g { background:var(--gold); } .pbf.t { background:var(--blue-btn); }
  .chicken-popup .pa { display:flex; gap:7px; margin-top:12px; }
  .mini-btn {
    padding:7px 14px; border-radius:10px; border:2.5px solid var(--outline);
    background:white; font-family:var(--font-body); font-size:0.75rem; font-weight:700;
    cursor:pointer; transition:all 0.1s; box-shadow:0 3px 0 var(--outline);
  }
  .mini-btn:hover { transform:translateY(-1px); box-shadow:0 4px 0 var(--outline); }
  .mini-btn:active { transform:translateY(2px); box-shadow:0 1px 0 var(--outline); }
  .mini-btn.accent { background:var(--pink); color:white; }
  .close-p { position:absolute; top:8px; right:12px; background:none; border:none;
    font-size:1.3rem; cursor:pointer; color:var(--text-muted); font-family:var(--font-body); font-weight:700; }

  /* ── Action Bar ─────────────────────────────── */
  .action-bar {
    display:flex; gap:10px; padding:0 20px; flex-wrap:wrap; justify-content:center;
  }
  .abtn {
    padding:13px 22px; border-radius:var(--radius-sm); border:3px solid var(--outline);
    background:white; color:var(--text); font-family:var(--font-body); font-size:0.88rem;
    font-weight:700; cursor:pointer; transition:all 0.1s;
    box-shadow:0 4px 0 var(--outline); display:flex; align-items:center; gap:7px; user-select:none;
  }
  .abtn:hover { transform:translateY(-2px); box-shadow:0 6px 0 var(--outline); }
  .abtn:active { transform:translateY(2px); box-shadow:0 2px 0 var(--outline); }
  .abtn:disabled { opacity:0.4; cursor:not-allowed; transform:none; box-shadow:0 4px 0 var(--outline); }
  .abtn.accent { background:var(--pink); color:white; }
  .abtn .bi { font-size:1.25rem; }

  /* ── Tip Card ────────────────────────────────── */
  .tip-card {
    margin:14px 20px 20px; background:white; border-radius:var(--radius);
    padding:20px 24px; border:3px solid var(--outline);
    box-shadow:0 5px 0 var(--outline), 0 6px 20px rgba(74,48,40,0.08);
    position:relative;
  }
  .tip-card .tbadge {
    display:inline-block; background:var(--gold); color:white;
    font-family:var(--font-body); font-weight:800; font-size:0.7rem;
    padding:4px 12px; border-radius:20px; border:2px solid var(--outline);
    text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px;
  }
  .tip-card .ttitle {
    font-family:var(--font-display); font-weight:700; font-size:1.1rem;
    color:var(--text); margin-bottom:5px;
  }
  .tip-card .tbody {
    font-family:var(--font-body); font-size:0.88rem; color:var(--text-muted); line-height:1.55; font-weight:600;
  }
  .tip-card .taction {
    display:inline-block; margin-top:10px; font-family:var(--font-body);
    font-size:0.82rem; color:var(--salmon); font-weight:700;
  }

  /* ── Toast ───────────────────────────────────── */
  .toast-container {
    position:fixed; top:90px; left:50%; transform:translateX(-50%);
    z-index:100; display:flex; flex-direction:column; gap:8px; pointer-events:none;
  }
  .toast {
    background:var(--text); color:white; padding:11px 24px; border-radius:24px;
    font-family:var(--font-body); font-size:0.88rem; font-weight:700;
    text-align:center; border:2.5px solid var(--outline);
    box-shadow:0 4px 0 var(--outline);
    animation:tin 0.3s ease-out, tout 0.25s 2s ease-in forwards;
    pointer-events:auto;
  }
  .toast.warn { background:var(--salmon); }
  .toast.ok { background:var(--green-btn); }
  @keyframes tin { 0%{opacity:0;transform:translateY(-14px);} 100%{opacity:1;transform:translateY(0);} }
  @keyframes tout { 0%{opacity:1;transform:translateY(0);} 100%{opacity:0;transform:translateY(-14px);} }

  .rst-area { text-align:center; padding:8px 20px 28px; }
  .rst-area button {
    background:none; border:none; color:var(--text-muted);
    font-family:var(--font-body); font-size:0.78rem; font-weight:700;
    cursor:pointer; text-decoration:underline;
  }
  .rst-area button:hover { color:var(--salmon); }

  @keyframes bob { 0%,100%{transform:translateY(0)} 40%{transform:translateY(-3px)} }
  @keyframes peck { 0%,100%{transform:translateY(0) rotate(0deg)} 35%{transform:translateY(3px) rotate(-3deg)} 70%{transform:translateY(0) rotate(2deg)} }
  @keyframes tilt { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-5deg)} 75%{transform:rotate(5deg)} }
  .anim-b { animation:bob 2.4s ease-in-out infinite; }
  .anim-p { animation:peck 1.1s ease-in-out infinite; }
  .anim-t { animation:tilt 3s ease-in-out infinite; }
</style>
</head>
<body>
<div class="app">
  <header class="header-bar">
    <div><span class="logo-text">Your First <span class="accent">Flock</span></span></div>
    <div class="header-stats">
      <div class="hstat">📅 Day <span class="val" id="hDay">1</span></div>
      <div class="hstat">🥚 <span class="val" id="hEggs">0</span></div>
      <div class="hstat">🐔 <span class="val" id="hFlock">3/3</span></div>
    </div>
    <div class="feed-pill">🌾 <strong id="hFeed">10</strong> scoops</div>
  </header>

  <div class="scene-wrap" id="sceneWrap">
    <svg viewBox="0 0 920 520" id="sceneSvg"></svg>
  </div>

  <div class="action-bar" id="actionBar"></div>

  <div class="tip-card" id="tipCard">
    <div class="tbadge">🐣 Chicken Knowledge</div>
    <div class="ttitle" id="tipTitle"></div>
    <div class="tbody" id="tipBody"></div>
    <div class="taction" id="tipAction"></div>
  </div>
  <div class="rst-area"><button onclick="resetGame()">Reset flock & start over</button></div>
</div>
<div class="toast-container" id="toastContainer"></div>

<script>
// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const NAMES=['Henrietta','Nugget','Cluckles','Eggwina','Pecky','Sunny','Daisy','Maple'];
const USED=new Set();
const TIPS=[
  {t:'Eggshells Are Mostly Calcium',b:'A single eggshell contains about 2 grams of calcium. Without enough dietary calcium, hens produce thin-shelled or shell-less eggs.',a:'💡 Supplement: crushed oyster shells or limestone grit.'},
  {t:'Chickens Need Grit to Digest',b:'Chickens don\'t have teeth. They swallow small stones that sit in their gizzard, grinding food like a natural mill.',a:'💡 Provide coarse sand or commercial poultry grit.'},
  {t:'A Hen Lays Every 24–26 Hours',b:'It takes about 25 hours for a hen to form an egg. They lay slightly later each day, eventually skipping a day.',a:'💡 Expect 5–6 eggs per hen per week, not one daily.'},
  {t:'Fresh Water > Food',b:'A chicken can survive weeks without food but only days without water. A laying hen drinks about 2 cups per day.',a:'💡 Check waterers twice daily. Ice cubes in summer.'},
  {t:'The Comb Reveals Health',b:'A bright red, plump comb means a healthy, laying hen. Pale or shrunken combs signal illness or mites.',a:'💡 Quick comb check every time you collect eggs.'},
  {t:'Dust Baths, Not Water Baths',b:'Chickens clean themselves by fluffing dry dirt through their feathers — it smothers parasites and absorbs oil.',a:'💡 Provide dry dirt, sand, and a little wood ash.'},
  {t:'Egg Color = Breed',b:'White earlobes usually mean white eggs. Red earlobes usually mean brown eggs. Some breeds lay blue or green.',a:'💡 Ameraucana and Cream Legbar lay blue eggs.'},
  {t:'Overfeeding Is Common',b:'Obesity leads to fatty liver syndrome, egg-binding, and reduced laying. Most backyard flocks are overfed.',a:'💡 About ¼ lb of feed per hen per day. Limit treats.'},
  {t:'Chickens Recognize Faces',b:'Chickens recognize up to 100 faces, including humans. They form social hierarchies that last for months.',a:'💡 Spend time near your flock daily — they\'ll trust you.'},
  {t:'The Bloom Protects Eggs',b:'Fresh eggs have a natural coating called the "bloom" that seals the pores. Unwashed eggs last weeks at room temp.',a:'💡 Only wash eggs right before use, then refrigerate.'},
  {t:'Body Temp: 105–107°F',b:'That high metabolism means they need constant food and water. Extra feed before bedtime helps in cold weather.',a:'💡 Scratch grains or corn before bed on cold nights.'},
  {t:'Molting = No Eggs',b:'Once a year, hens shed and regrow feathers for 8–16 weeks. They stop laying entirely during molt.',a:'💡 Switch to higher-protein feed (18–20%) during molt.'},
  {t:'Predators Come From All Sides',b:'Hawks, raccoons, foxes, and weasels are top threats. A weasel can squeeze through a 1-inch gap.',a:'💡 Use ½-inch hardware cloth, buried 12 inches deep.'},
  {t:'Yolk Color = Diet',b:'Deep orange yolks come from carotenoids in marigolds, alfalfa, and leafy greens. Pale yolks = grain-only diet.',a:'💡 Free-range access to grass and bugs for rich yolks.'},
  {t:'Descendants of Dinosaurs',b:'Chickens descend from the Red Junglefowl. T. rex is closer to chickens than to Stegosaurus.',a:'💡 Your flock carries 150 million years of lineage.'},
];
let G=load();
function dflt(){USED.clear();return{day:1,eggs:0,feed:10,ti:0,ut:[],sel:null,
  cks:[{n:pick(),h:100,hu:25,th:20,et:10,ld:0},{n:pick(),h:100,hu:20,th:30,et:50,ld:0},{n:pick(),h:100,hu:30,th:15,et:75,ld:0}]};}
function pick(){const a=NAMES.filter(n=>!USED.has(n));const n=a.length?a[Math.floor(Math.random()*a.length)]:'Chicky';USED.add(n);return n;}
function load(){try{const s=JSON.parse(localStorage.getItem('yff-v5'));if(s){s.cks.forEach(c=>USED.add(c.n));return s;}}catch(e){}return dflt();}
function save(){localStorage.setItem('yff-v5',JSON.stringify(G));}
function resetGame(){G=dflt();save();renderAll();toast('Fresh flock! 🐣','ok');}

// ═══════════════════════════════════════════════════════════
// LOGIC
// ═══════════════════════════════════════════════════════════
function tick(n){
  for(const c of G.cks){if(c.h<=0)continue;c.hu=Math.min(100,c.hu+n*2);c.th=Math.min(100,c.th+n*3);if(c.hu>=80||c.th>=80)c.h=Math.max(0,c.h-n*2);c.et=Math.min(100,c.et+n*3);}
  G.day+=Math.floor(n/5);
}
function feed1(i){const c=G.cks[i];if(c.h<=0)return toast(c.n+' is gone 😢','warn');if(G.feed<=0)return toast('Out of feed! 🏪','warn');G.feed--;c.hu=Math.max(0,c.hu-35);if(c.hu<30&&c.h<100&&c.th<80)c.h=Math.min(100,c.h+3);tick(2);save();renderAll();ntip();toast('Fed '+c.n+'!','ok');}
function water1(i){const c=G.cks[i];if(c.h<=0)return toast(c.n+' is gone 😢','warn');c.th=Math.max(0,c.th-40);if(c.th<30&&c.h<100&&c.hu<80)c.h=Math.min(100,c.h+3);tick(2);save();renderAll();ntip();toast('Watered '+c.n+'!','ok');}
function egg1(i){const c=G.cks[i];if(c.h<=0)return toast(c.n+' is gone 😢','warn');if(c.et<80)return toast(c.n+' isn\'t ready ⏳','warn');c.et=0;c.ld++;G.eggs++;tick(2);save();renderAll();ntip();toast('🥚 +1 from '+c.n+'!','ok');}
function feedAll(){if(G.feed<=0)return toast('Out of feed! 🏪','warn');const al=G.cks.filter(c=>c.h>0);if(!al.length)return toast('No chickens 😢','warn');const n=Math.min(G.feed,al.length);G.feed-=n;al.slice(0,n).forEach(c=>{c.hu=Math.max(0,c.hu-30);if(c.hu<30&&c.h<100)c.h=Math.min(100,c.h+3);});tick(3);save();renderAll();ntip();toast('Fed '+n+' chicken(s)!','ok');}
function waterAll(){const al=G.cks.filter(c=>c.h>0);if(!al.length)return toast('No chickens 😢','warn');al.forEach(c=>{c.th=Math.max(0,c.th-35);if(c.th<30&&c.h<100)c.h=Math.min(100,c.h+3);});tick(3);save();renderAll();ntip();toast('Watered all!','ok');}
function collAll(){const rd=G.cks.filter(c=>c.h>0&&c.et>=80);if(!rd.length)return toast('No eggs ready ⏳','warn');rd.forEach(c=>{c.et=0;c.ld++;G.eggs++;});tick(3);save();renderAll();ntip();toast('Collected '+rd.length+' egg(s)! 🥚','ok');}
function buyFeed(){G.feed+=10;save();renderAll();toast('+10 scoops! 🛒','ok');}
function sel(i){G.sel=G.sel===i?null:i;renderAll();}
function ntip(){const av=TIPS.map((_,i)=>i).filter(i=>!G.ut.includes(i));if(!av.length){G.ut=[];return ntip();}G.ti=av[Math.floor(Math.random()*av.length)];G.ut.push(G.ti);}
function toast(m,t){const c=document.getElementById('toastContainer');const e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;c.appendChild(e);setTimeout(()=>e.remove(),2400);}

// ═══════════════════════════════════════════════════════════
// SVG HELPERS
// ═══════════════════════════════════════════════════════════
const NS='http://www.w3.org/2000/svg';
function E(t,a,x){const e=document.createElementNS(NS,t);for(const[k,v]of Object.entries(a||{}))e.setAttribute(k,v);if(x!==undefined)e.textContent=x;return e;}
const OL={stroke:'#4A3028','stroke-width':'2.5','stroke-linecap':'round','stroke-linejoin':'round'};

// Draw a cartoon chicken
function drawChicken(c,dotColor,animClass){
  const g=E('g',{class:'chicken-g '+animClass});
  // Drop shadow
  g.appendChild(E('ellipse',{cx:0,cy:26,rx:22,ry:6,fill:'rgba(74,48,40,0.15)'}));
  // Legs
  g.appendChild(E('line',{x1:-8,y1:14,x2:-10,y2:24,...OL,stroke:'#D49530','stroke-width':'3'}));
  g.appendChild(E('line',{x1:8,y1:14,x2:10,y2:24,...OL,stroke:'#D49530','stroke-width':'3'}));
  g.appendChild(E('line',{x1:-14,y1:24,x2:-6,y2:24,...OL,stroke:'#D49530','stroke-width':'2.5'}));
  g.appendChild(E('line',{x1:6,y1:24,x2:14,y2:24,...OL,stroke:'#D49530','stroke-width':'2.5'}));
  // Body (small, scrawny)
  g.appendChild(E('ellipse',{cx:0,cy:4,rx:18,ry:14,fill:'#FDF8F0',...OL}));
  // Wing
  g.appendChild(E('path',{d:'M-4,2 Q-12,4 -8,12 Q-2,14 4,10 Q0,6 -4,2Z',fill:'#F0E8D8',...OL,'stroke-width':'1.5'}));
  // Tail
  g.appendChild(E('path',{d:'M-14,-2 Q-22,-8 -18,2 Q-16,6 -10,4Z',fill:'#F8F0E4',...OL,'stroke-width':'2'}));
  // Neck
  g.appendChild(E('ellipse',{cx:8,cy:-10,rx:7,ry:10,fill:'#FDF8F0',...OL}));
  // HEAD (big — chibi style)
  g.appendChild(E('circle',{cx:9,cy:-22,r:14,fill:'#FDF8F0',...OL}));
  // Comb (wavy)
  g.appendChild(E('path',{d:'M2,-34 Q4,-40 6,-34 Q8,-40 10,-34 Q12,-40 14,-34 Q14,-36 16,-34 Q10,-28 4,-28Z',fill:'#E57373',...OL,'stroke-width':'2'}));
  // Eyes (huge googly)
  g.appendChild(E('circle',{cx:5,cy:-24,r:6,fill:'white',...OL,'stroke-width':'2'}));
  g.appendChild(E('circle',{cx:15,cy:-25,r:5.5,fill:'white',...OL,'stroke-width':'2'}));
  // Pupils
  g.appendChild(E('circle',{cx:5,cy:-23,r:2.8,fill:'#4A3028'}));
  g.appendChild(E('circle',{cx:15,cy:-24,r:2.5,fill:'#4A3028'}));
  // Catchlights
  g.appendChild(E('circle',{cx:6,cy:-25,r:1.2,fill:'white'}));
  g.appendChild(E('circle',{cx:16,cy:-26,r:1,fill:'white'}));
  // Eyebrows
  g.appendChild(E('line',{x1:1,y1:-31,x2:8,y2:-30,...OL,'stroke-width':'2'}));
  g.appendChild(E('line',{x1:12,y1:-31,x2:18,y2:-32,...OL,'stroke-width':'2'}));
  // Beak
  g.appendChild(E('polygon',{points:'20,-24 27,-22 20,-19',fill:'#F4B840',...OL,'stroke-width':'2'}));
  // Wattle
  g.appendChild(E('path',{d:'M6,-10 Q9,-6 12,-10 Q10,-12 6,-10Z',fill:'#E57373',...OL,'stroke-width':'1.5'}));
  // Health dot
  g.appendChild(E('circle',{cx:9,cy:-42,r:5,fill:dotColor,...OL,'stroke-width':'2'}));

  return g;
}

// ═══════════════════════════════════════════════════════════
// SCENE RENDER
// ═══════════════════════════════════════════════════════════
function renderScene(){
  const svg=document.getElementById('sceneSvg');svg.innerHTML='';

  // ── Defs ──
  const defs=E('defs');
  const addG=(id,stops)=>{
    const g=E('linearGradient',{id,x1:'0',y1:'0',x2:'0',y2:'1'});
    stops.forEach(([o,c])=>g.appendChild(E('stop',{offset:o,'stop-color':c})));
    defs.appendChild(g);
  };
  addG('skyG',[['0%','#C5E3F0'],['100%','#E5F2F8']]);
  addG('grassG',[['0%','#AED8B8'],['100%','#8CC09A']]);
  addG('woodG',[['0%','#F0E0CC'],['100%','#E0CCB0']]);
  addG('roofG',[['0%','#D4907A'],['100%','#B06850']]);
  const sh=E('filter',{id:'sh',x:'-20%',y:'-20%',width:'140%',height:'140%'});
  sh.innerHTML='<feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4A3028" flood-opacity="0.12"/>';
  defs.appendChild(sh);
  svg.appendChild(defs);

  // ── Sky & Clouds ──
  svg.appendChild(E('rect',{x:0,y:0,width:920,height:180,fill:'url(#skyG)'}));
  const sun=E('g',{transform:'translate(810,40)'});
  sun.appendChild(E('circle',{r:28,fill:'#FFF3C0',...OL,'stroke-width':'2.5'}));
  sun.appendChild(E('circle',{r:20,fill:'#FFE8A0'}));
  svg.appendChild(sun);
  // Clouds
  const addC=(cx,cy,s)=>{
    const g=E('g',{transform:`translate(${cx},${cy}) scale(${s})`,opacity:'0.8'});
    g.appendChild(E('ellipse',{cx:0,cy:0,rx:36,ry:14,fill:'white',...OL,'stroke-width':'2'}));
    g.appendChild(E('circle',{cx:-18,cy:-4,r:16,fill:'white',...OL,'stroke-width':'2'}));
    g.appendChild(E('circle',{cx:10,cy:-8,r:19,fill:'white',...OL,'stroke-width':'2'}));
    g.appendChild(E('circle',{cx:26,cy:-1,r:14,fill:'white',...OL,'stroke-width':'2'}));
    svg.appendChild(g);
  };
  addC(100,35,1);addC(340,25,0.8);addC(580,40,0.9);

  // ── Ground ──
  svg.appendChild(E('rect',{x:0,y:160,width:920,height:360,fill:'url(#grassG)'}));
  // Dirt patches
  svg.appendChild(E('ellipse',{cx:460,cy:340,rx:320,ry:50,fill:'#E8D8C0',opacity:'0.4'}));

  // ── Fence ──
  for(let x=40;x<900;x+=95){
    svg.appendChild(E('rect',{x:x-5,y:175,width:10,height:24,rx:3,fill:'#D4B896',...OL,'stroke-width':'2'}));
  }
  svg.appendChild(E('line',{x1:35,y1:186,x2:885,y2:186,...OL,stroke:'#C8A878','stroke-width':'2'}));

  // ── Decorative elements ──
  const bush=(x,y,s)=>{
    const g=E('g',{transform:`translate(${x},${y}) scale(${s})`});
    g.appendChild(E('circle',{cx:-10,cy:-2,r:12,fill:'#7BA860',...OL,'stroke-width':'2'}));
    g.appendChild(E('circle',{cx:10,cy:-2,r:12,fill:'#8CB870',...OL,'stroke-width':'2'}));
    g.appendChild(E('circle',{cx:0,cy:-12,r:14,fill:'#9CC880',...OL,'stroke-width':'2'}));
    svg.appendChild(g);
  };
  bush(870,220,1.1);bush(50,200,0.9);

  // ── COOP ──
  const coop=E('g',{transform:'translate(35,195)',filter:'url(#sh)'});
  // Walls
  coop.appendChild(E('rect',{x:0,y:30,width:280,height:120,rx:6,fill:'url(#woodG)',...OL,'stroke-width':'3'}));
  // Planks
  for(let y=50;y<150;y+=22)
    coop.appendChild(E('line',{x1:2,y1:y,x2:278,y2:y,stroke:'rgba(0,0,0,0.08)','stroke-width':'1'}));
  // Roof
  coop.appendChild(E('polygon',{points:'-10,30 140,-14 290,30',fill:'url(#roofG)',...OL,'stroke-width':'3'}));
  coop.appendChild(E('line',{x1:140,y1:-14,x2:140,y2:-14,stroke:'#4A3028','stroke-width':'5','stroke-linecap':'round'}));
  // Door
  coop.appendChild(E('rect',{x:200,y:60,width:52,height:74,rx:26,fill:'#8B5E3C',...OL,'stroke-width':'3'}));
  coop.appendChild(E('circle',{cx:238,cy:98,r:3.5,fill:'#F4B840',...OL,'stroke-width':'1.5'}));
  // Window
  coop.appendChild(E('rect',{x:35,y:52,width:38,height:38,rx:3,fill:'#E5F2F8',...OL,'stroke-width':'2.5'}));
  coop.appendChild(E('line',{x1:54,y1:52,x2:54,y2:90,stroke:'#4A3028','stroke-width':'2'}));
  coop.appendChild(E('line',{x1:35,y1:71,x2:73,y2:71,stroke:'#4A3028','stroke-width':'2'}));
  // COOP label
  coop.appendChild(E('rect',{x:110,y:-8,width:60,height:22,rx:11,fill:'rgba(255,255,255,0.92)',...OL,'stroke-width':'2.5'}));
  coop.appendChild(E('text',{x:140,y:7,'text-anchor':'middle',fill:'#4A3028','font-family':'Nunito,sans-serif','font-weight':'800','font-size':'11'},'COOP'));
  svg.appendChild(coop);

  // ── NESTING BOXES ──
  const nestG=E('g',{transform:'translate(50,340)',filter:'url(#sh)'});
  nestG.appendChild(E('ellipse',{cx:70,cy:18,rx:82,ry:15,fill:'#F0E0C0',opacity:'0.5'}));
  nestG.appendChild(E('rect',{x:18,y:-20,width:104,height:18,rx:9,fill:'rgba(255,255,255,0.92)',...OL,'stroke-width':'2.5'}));
  nestG.appendChild(E('text',{x:70,y:-7,'text-anchor':'middle',fill:'#4A3028','font-family':'Nunito,sans-serif','font-weight':'800','font-size':'10'},'NESTING BOXES'));

  G.cks.forEach((c,i)=>{
    if(c.h<=0)return;
    const bx=12+i*54,eggR=c.et>=80;
    const box=E('g',{class:'clickable',transform:`translate(${bx},0)`});
    box.appendChild(E('rect',{x:0,y:0,width:46,height:38,rx:4,fill:'url(#woodG)',...OL,'stroke-width':'2.5'}));
    box.appendChild(E('path',{d:'M5,7 Q12,3 23,7 Q34,3 41,7',stroke:'#E8D0A0','stroke-width':'2',fill:'none'}));
    if(eggR){
      box.appendChild(E('ellipse',{cx:23,cy:16,rx:8,ry:10,fill:'#FDF8F0',...OL,'stroke-width':'2'}));
      box.appendChild(E('ellipse',{cx:23,cy:14,rx:4,ry:5,fill:'white',opacity:'0.4'}));
    }
    box.appendChild(E('text',{x:23,y:52,'text-anchor':'middle',fill:'#8B7060','font-family':'Nunito,sans-serif','font-size':'9','font-weight':'700'},c.n.split(' ')[0]));
    box.onclick=()=>egg1(i);
    nestG.appendChild(box);
  });
  svg.appendChild(nestG);

  // ── WATERER ──
  const wat=E('g',{class:'clickable',transform:'translate(250,365)',filter:'url(#sh)'});
  wat.appendChild(E('ellipse',{cx:22,cy:22,rx:22,ry:9,fill:'#B8DCE8',...OL,'stroke-width':'2.5'}));
  wat.appendChild(E('path',{d:'M8,22 Q8,4 22,3 Q36,4 36,22',fill:'#D8EEF4',...OL,'stroke-width':'2.5'}));
  wat.appendChild(E('ellipse',{cx:22,cy:13,rx:14,ry:6,fill:'#B0DCE8',opacity:'0.5'}));
  wat.appendChild(E('path',{d:'M22,6 Q22,3 22,3 Q22,3 22,6 Q18,10 18,13 Q18,17 22,17 Q26,17 26,13 Q26,10 22,6Z',fill:'#6BA8C0',...OL,'stroke-width':'1.5'}));
  wat.appendChild(E('rect',{x:0,y:34,width:44,height:18,rx:9,fill:'rgba(255,255,255,0.92)',...OL,'stroke-width':'2.5'}));
  wat.appendChild(E('text',{x:22,y:46,'text-anchor':'middle',fill:'#4A3028','font-family':'Nunito,sans-serif','font-weight':'800','font-size':'10'},'WATER'));
  wat.onclick=()=>waterAll();
  svg.appendChild(wat);

  // ── CHICKENS ──
  const cP=[{x:380,y:390,a:'anim-b'},{x:540,y:380,a:'anim-p'},{x:710,y:395,a:'anim-t'}];
  G.cks.forEach((c,i)=>{
    if(c.h<=0)return;
    const p=cP[i]||cP[0];
    let dc='#8CC09A';
    if(c.h<30||c.hu>=80||c.th>=80)dc='#E57373';
    else if(c.h<60||c.hu>=50||c.th>=50)dc='#F4B840';

    const chk=E('g',{class:'clickable',transform:`translate(${p.x},${p.y})`,filter:'url(#sh)'});
    chk.appendChild(drawChicken(c,dc,p.a));

    // Name tag
    const tw=c.n.length*7+18;
    const tag=E('g',{transform:'translate(0,-48)',opacity:G.sel===i?'1':'0',style:'transition:opacity 0.2s'});
    tag.appendChild(E('rect',{x:-tw/2,y:-8,width:tw,height:17,rx:8,fill:'white',...OL,'stroke-width':'2.5'}));
    tag.appendChild(E('text',{x:0,y:4,'text-anchor':'middle',fill:'#4A3028','font-family':'Nunito,sans-serif','font-weight':'700','font-size':'10'},c.n));
    chk.appendChild(tag);
    chk.onmouseenter=()=>tag.setAttribute('opacity','1');
    chk.onmouseleave=()=>tag.setAttribute('opacity',G.sel===i?'1':'0');
    chk.onclick=(e)=>{e.stopPropagation();sel(i);};
    svg.appendChild(chk);
  });

  // ── FEED TROUGH ──
  const tr=E('g',{class:'clickable',transform:'translate(390,445)',filter:'url(#sh)'});
  tr.appendChild(E('rect',{x:2,y:3,width:136,height:22,rx:6,fill:'rgba(0,0,0,0.06)'}));
  tr.appendChild(E('rect',{x:0,y:0,width:140,height:22,rx:6,fill:'url(#woodG)',...OL,'stroke-width':'3'}));
  tr.appendChild(E('rect',{x:5,y:3,width:130,height:12,rx:4,fill:'#F0E0B0'}));
  for(let i=0;i<13;i++)tr.appendChild(E('circle',{cx:12+i*10,cy:9,r:1.5,fill:'#D4C090',opacity:'0.6'}));
  tr.appendChild(E('rect',{x:10,y:26,width:120,height:18,rx:9,fill:'rgba(255,255,255,0.92)',...OL,'stroke-width':'2.5'}));
  tr.appendChild(E('text',{x:70,y:38,'text-anchor':'middle',fill:'#4A3028','font-family':'Nunito,sans-serif','font-weight':'800','font-size':'10'},'FEED TROUGH'));
  tr.onclick=()=>feedAll();
  svg.appendChild(tr);

  // ── POPUP ──
  if(G.sel!==null){
    const c=G.cks[G.sel],p=cP[G.sel]||cP[0],eggR=c.et>=80;
    const wrap=document.getElementById('sceneWrap');
    wrap.querySelectorAll('.chicken-popup').forEach(e=>e.remove());
    const pop=document.createElement('div');pop.className='chicken-popup';
    const pctX=(p.x/920)*100;
    pop.style.cssText=`position:absolute;top:${p.y-195}px;left:${pctX<35?p.x+65:p.x-215}px;z-index:25;`;
    pop.innerHTML=`
      <button class="close-p" onclick="event.stopPropagation();G.sel=null;renderAll();">&times;</button>
      <div class="pn">${c.n} 🐔</div>
      <div class="ps">Health <div class="pb"><div class="pbf h" style="width:${c.h}%"></div></div></div>
      <div class="ps">Hunger <div class="pb"><div class="pbf g" style="width:${c.hu}%"></div></div></div>
      <div class="ps">Thirst <div class="pb"><div class="pbf t" style="width:${c.th}%"></div></div></div>
      <div class="ps" style="font-size:0.74rem;">🥚 ${c.ld} eggs${eggR?' — Ready!':''}</div>
      <div class="pa">
        <button class="mini-btn" onclick="event.stopPropagation();feed1(${G.sel})">🍽️ Feed</button>
        <button class="mini-btn" onclick="event.stopPropagation();water1(${G.sel})">💧 Water</button>
        <button class="mini-btn ${eggR?'accent':''}" onclick="event.stopPropagation();egg1(${G.sel})">🥚 Collect</button>
      </div>`;
    wrap.appendChild(pop);
  }
}

// ═══════════════════════════════════════════════════════════
// FULL RENDER
// ═══════════════════════════════════════════════════════════
function renderAll(){
  const al=G.cks.filter(c=>c.h>0);
  document.getElementById('hDay').textContent=G.day;
  document.getElementById('hEggs').textContent=G.eggs;
  document.getElementById('hFlock').textContent=al.length+'/'+G.cks.length;
  document.getElementById('hFeed').textContent=G.feed;
  renderScene();
  const hf=G.feed>0,ha=al.length>0,ae=al.some(c=>c.et>=80);
  document.getElementById('actionBar').innerHTML=`
    <button class="abtn" onclick="feedAll()" ${!hf||!ha?'disabled':''}>🍽️ Feed All</button>
    <button class="abtn" onclick="waterAll()" ${!ha?'disabled':''}>💧 Water All</button>
    <button class="abtn ${ae?'accent':''}" onclick="collAll()" ${!ae?'disabled':''}>🥚 Collect All</button>
    <button class="abtn" onclick="buyFeed()">🛒 Buy Feed (+10)</button>`;
  const tip=TIPS[G.ti%TIPS.length];
  document.getElementById('tipTitle').textContent=tip.t;
  document.getElementById('tipBody').textContent=tip.b;
  document.getElementById('tipAction').textContent=tip.a;
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
renderAll();
setInterval(()=>{tick(1);save();renderAll();},25000);
</script>
</body>
</html>
