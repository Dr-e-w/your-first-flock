<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your First Flock — Chicken Care Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F0E8;
    --header-bg: rgba(255, 252, 247, 0.92);
    --sky-top: #B8D4E3;
    --sky-bottom: #E8F0F4;
    --grass: #7BA05B;
    --grass-dark: #5C7A3E;
    --dirt: #C4A87C;
    --dirt-dark: #A8895C;
    --wood: #B8956E;
    --wood-dark: #8B6F4E;
    --wood-light: #D4B896;
    --roof: #8B5E3C;
    --roof-dark: #6B3F22;
    --fence: #D4B896;
    --fence-post: #A07850;
    --text: #2C2416;
    --text-muted: #6B5D4E;
    --accent: #D4855E;
    --accent-hover: #C0704A;
    --green: #5B8C5A;
    --green-light: #A8D4A6;
    --red: #D4634C;
    --red-light: #F0B4A8;
    --blue: #5B8BA0;
    --gold: #D4A04A;
    --shadow: 0 2px 16px rgba(44, 36, 22, 0.10);
    --radius: 14px;
    --scene-height: 520px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    overflow-x: hidden;
  }

  .app {
    width: 100%;
    max-width: 960px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ── Header Bar ──────────────────────────────── */
  .header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    background: var(--header-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(0,0,0,0.06);
    position: sticky;
    top: 0;
    z-index: 50;
    gap: 16px;
    flex-wrap: wrap;
  }
  .header-bar .logo-area {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header-bar .logo-icon { font-size: 1.6rem; }
  .header-bar .logo-text {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 1.25rem;
    color: var(--text);
    letter-spacing: -0.3px;
  }
  .header-bar .logo-text span { color: var(--accent); }
  .header-stats {
    display: flex;
    gap: 24px;
    align-items: center;
  }
  .header-stat {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-muted);
  }
  .header-stat .hs-val {
    color: var(--text);
    font-weight: 700;
    font-family: 'Outfit', sans-serif;
    font-size: 1.05rem;
  }
  .header-stat .hs-icon { font-size: 1.15rem; }
  .feed-indicator {
    font-size: 0.78rem;
    color: var(--text-muted);
    background: rgba(0,0,0,0.04);
    padding: 5px 12px;
    border-radius: 20px;
  }
  .feed-indicator strong { color: var(--text); }

  /* ── Scene Wrapper ───────────────────────────── */
  .scene-wrapper {
    margin: 16px 20px;
    height: var(--scene-height);
    position: relative;
  }
  .scene {
    width: 100%;
    height: 100%;
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(44, 36, 22, 0.12);
    position: relative;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 60%, #E8DCC8 100%);
    cursor: default;
  }

  /* Sky elements */
  .cloud {
    position: absolute;
    background: white;
    border-radius: 50px;
    opacity: 0.78;
    z-index: 0;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: white;
    border-radius: 50%;
  }
  .cloud-1 {
    width: 110px; height: 40px;
    top: 6%; left: 8%;
  }
  .cloud-1::before { width: 50px; height: 50px; top: -24px; left: 22px; }
  .cloud-1::after { width: 40px; height: 40px; top: -16px; left: 56px; }
  .cloud-2 {
    width: 90px; height: 32px;
    top: 4%; right: 12%;
  }
  .cloud-2::before { width: 40px; height: 40px; top: -20px; left: 18px; }
  .cloud-2::after { width: 32px; height: 32px; top: -12px; left: 48px; }

  /* Ground plane */
  .ground-plane {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 72%;
    background: linear-gradient(180deg,
      #D4C4A4 0%,
      #C4A87C 3%,
      var(--grass) 10%,
      #6B9A4E 100%
    );
    z-index: 1;
  }
  .grass-texture {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,0.04) 1px, transparent 1px),
      radial-gradient(circle at 25% 35%, rgba(255,255,255,0.04) 1px, transparent 1px),
      radial-gradient(circle at 38% 52%, rgba(255,255,255,0.04) 1px, transparent 1px),
      radial-gradient(circle at 52% 28%, rgba(255,255,255,0.04) 1px, transparent 1px),
      radial-gradient(circle at 65% 45%, rgba(255,255,255,0.04) 1px, transparent 1px),
      radial-gradient(circle at 78% 22%, rgba(255,255,255,0.04) 1px, transparent 1px),
      radial-gradient(circle at 88% 55%, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* ── Fence boundary ──────────────────────────── */
  .fence-area {
    position: absolute;
    top: 28%;
    left: 4%;
    right: 4%;
    bottom: 4%;
    border: 4px solid var(--fence);
    border-radius: 6px;
    z-index: 2;
    pointer-events: none;
  }
  .fence-post-el {
    position: absolute;
    width: 9px;
    background: var(--fence-post);
    border-radius: 2px 2px 0 0;
    z-index: 3;
    pointer-events: none;
  }

  /* ── Coop structure (back wall, inside fence) ── */
  .coop-structure {
    position: absolute;
    top: 28%;
    left: 4%;
    width: 44%;
    height: 38%;
    z-index: 3;
    pointer-events: none;
  }
  .coop-back-wall {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, var(--wood-light) 0%, var(--wood) 100%);
    border: 3px solid var(--wood-dark);
    border-radius: 4px 4px 0 0;
  }
  .coop-back-wall::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 16px,
      rgba(0,0,0,0.03) 16px, rgba(0,0,0,0.03) 18px
    );
  }
  .coop-roof-slant {
    position: absolute;
    top: -28px; left: -8px; right: -8px;
    height: 32px;
    background: linear-gradient(180deg, var(--roof) 0%, var(--roof-dark) 100%);
    clip-path: polygon(0% 100%, 10% 0%, 90% 0%, 100% 100%);
  }
  .coop-label {
    position: absolute;
    top: -44px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(44,36,22,0.85);
    color: white;
    padding: 4px 14px;
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.72rem;
    letter-spacing: 0.3px;
    white-space: nowrap;
    pointer-events: none;
  }

  /* ── Interactive Props ───────────────────────── */
  .prop {
    position: absolute;
    cursor: pointer;
    z-index: 10;
    transition: transform 0.15s, filter 0.15s;
  }
  .prop:hover { transform: scale(1.06); filter: brightness(1.08); }
  .prop:active { transform: scale(0.94); }

  .prop-label {
    position: absolute;
    bottom: -26px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(44,36,22,0.88);
    color: white;
    padding: 3px 11px;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.68rem;
    letter-spacing: 0.4px;
    white-space: nowrap;
    pointer-events: none;
  }
  .prop:hover .prop-label { background: rgba(44,36,22,0.95); }

  /* Nesting boxes — 3 boxes along coop back wall */
  .nesting-boxes-row {
    position: absolute;
    display: flex;
    gap: 8px;
    z-index: 11;
  }
  .nest-box {
    width: 52px;
    height: 44px;
    background: linear-gradient(180deg, #F0E0C0, #D4B896);
    border: 3px solid var(--dirt-dark);
    border-radius: 5px 5px 0 0;
    cursor: pointer;
    position: relative;
    transition: transform 0.15s;
  }
  .nest-box:hover { transform: translateY(-3px); }
  .nest-box .egg-in-nest {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.9rem;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .nest-box.has-egg .egg-in-nest { opacity: 1; }
  .nest-box .hen-label {
    position: absolute;
    bottom: -22px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.58rem;
    font-weight: 600;
    color: var(--text-muted);
    white-space: nowrap;
    pointer-events: none;
    font-family: 'Inter', sans-serif;
  }
  .nest-row-label {
    position: absolute;
    top: -24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(44,36,22,0.85);
    color: white;
    padding: 3px 10px;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.65rem;
    letter-spacing: 0.4px;
    white-space: nowrap;
    pointer-events: none;
  }

  /* Feed trough */
  .feed-trough-prop {
    position: absolute;
    z-index: 11;
    cursor: pointer;
  }
  .trough-body {
    width: 80px;
    height: 30px;
    background: linear-gradient(180deg, var(--wood-light), var(--wood));
    border: 3px solid var(--wood-dark);
    border-radius: 6px;
    position: relative;
  }
  .trough-body::after {
    content: '';
    position: absolute;
    top: 4px; left: 6px; right: 6px; bottom: 4px;
    background: #F0E0B0;
    border-radius: 3px;
  }

  /* Waterer */
  .waterer-prop {
    position: absolute;
    z-index: 11;
    cursor: pointer;
  }
  .waterer-body {
    width: 48px;
    height: 40px;
    background: linear-gradient(180deg, #D8ECF4, #A0C8D8);
    border: 3px solid #7AADC0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
  }

  /* ── Chicken Sprites ─────────────────────────── */
  .chicken-sprite {
    position: absolute;
    cursor: pointer;
    z-index: 9;
    transition: transform 0.15s;
  }
  .chicken-sprite:hover { transform: scale(1.08); }
  .chicken-sprite.selected { z-index: 14; }

  .chicken-body {
    width: 52px;
    height: 38px;
    background: linear-gradient(180deg, #F8F0E0, #EDD8B8);
    border-radius: 50% 50% 45% 45%;
    position: relative;
    box-shadow: inset 0 -4px 8px rgba(0,0,0,0.06);
  }
  .chicken-head {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    width: 26px;
    height: 26px;
    background: #F8F0E0;
    border-radius: 50%;
  }
  .chicken-comb {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 16px;
    height: 12px;
    background: #E8504A;
    border-radius: 50% 50% 0 0;
  }
  .chicken-beak {
    position: absolute;
    top: 6px;
    right: -6px;
    width: 0; height: 0;
    border-left: 7px solid #E8A030;
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
  }
  .chicken-eye {
    position: absolute;
    top: 6px;
    right: 1px;
    width: 6px; height: 6px;
    background: #2C2416;
    border-radius: 50%;
  }
  .chicken-wattle {
    position: absolute;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px; height: 7px;
    background: #E8504A;
    border-radius: 0 0 50% 50%;
  }
  .chicken-legs {
    position: absolute;
    bottom: -14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
  }
  .chicken-leg {
    width: 3px; height: 14px;
    background: #E8A030;
    border-radius: 1px;
  }

  .health-dot {
    position: absolute;
    top: -36px;
    left: 50%;
    transform: translateX(-50%);
    width: 12px; height: 12px;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 1px 5px rgba(0,0,0,0.15);
    z-index: 1;
  }
  .health-dot.good { background: var(--green); }
  .health-dot.ok { background: var(--gold); }
  .health-dot.bad { background: var(--red); }

  .chicken-name-tag {
    position: absolute;
    top: -52px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.64rem;
    font-weight: 600;
    color: var(--text);
    background: rgba(255,255,255,0.94);
    padding: 2px 9px;
    border-radius: 10px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    font-family: 'Inter', sans-serif;
    box-shadow: 0 1px 6px rgba(0,0,0,0.08);
  }
  .chicken-sprite:hover .chicken-name-tag,
  .chicken-sprite.selected .chicken-name-tag { opacity: 1; }

  @keyframes chicken-bob {
    0%, 100% { transform: translateY(0); }
    30% { transform: translateY(-4px); }
    60% { transform: translateY(-1px); }
  }
  @keyframes chicken-peck {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    40% { transform: translateY(3px) rotate(-4deg); }
    80% { transform: translateY(1px) rotate(2deg); }
  }
  .chicken-anim-idle { animation: chicken-bob 2.8s ease-in-out infinite; }
  .chicken-anim-peck { animation: chicken-peck 1.4s ease-in-out infinite; }

  /* ── Selected Chicken Popup ─────────────────── */
  .chicken-popup {
    position: absolute;
    background: white;
    border-radius: var(--radius);
    padding: 16px 20px;
    box-shadow: 0 8px 32px rgba(44,36,22,0.20);
    z-index: 25;
    min-width: 190px;
    pointer-events: auto;
    font-family: 'Inter', sans-serif;
  }
  .chicken-popup .popup-name {
    font-family: 'Outfit', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 10px;
  }
  .chicken-popup .popup-stat {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    color: var(--text-muted);
    margin-bottom: 5px;
  }
  .chicken-popup .popup-bar {
    flex: 1;
    height: 6px;
    background: #E8DDD0;
    border-radius: 3px;
    overflow: hidden;
  }
  .chicken-popup .popup-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.4s;
  }
  .chicken-popup .popup-bar-fill.health-bar { background: var(--green); }
  .chicken-popup .popup-bar-fill.hunger-bar { background: var(--gold); }
  .chicken-popup .popup-bar-fill.thirst-bar { background: var(--blue); }
  .chicken-popup .popup-actions {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }
  .chicken-popup .mini-btn {
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid #E8DDD0;
    background: #FAF7F2;
    font-size: 0.72rem;
    cursor: pointer;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    transition: all 0.15s;
  }
  .chicken-popup .mini-btn:hover { background: #F0EBE0; }
  .chicken-popup .mini-btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
  .chicken-popup .mini-btn.primary:hover { background: var(--accent-hover); }
  .chicken-popup .close-popup {
    position: absolute;
    top: 8px; right: 12px;
    background: none; border: none;
    font-size: 1.2rem; cursor: pointer;
    color: var(--text-muted);
    line-height: 1;
  }

  /* ── Action Bar ─────────────────────────────── */
  .action-bar {
    display: flex;
    gap: 10px;
    padding: 0 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .action-btn {
    padding: 12px 22px;
    border-radius: 12px;
    border: 1px solid #E0D8CC;
    background: white;
    color: var(--text);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 7px;
    box-shadow: var(--shadow);
    user-select: none;
  }
  .action-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 20px rgba(44,36,22,0.14);
  }
  .action-btn:active { transform: translateY(0); }
  .action-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  .action-btn.primary-btn {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  .action-btn.primary-btn:hover { background: var(--accent-hover); }
  .action-btn .btn-icon { font-size: 1.2rem; }

  /* ── Tip Card ────────────────────────────────── */
  .tip-card {
    margin: 14px 20px 20px;
    background: white;
    border-radius: var(--radius);
    padding: 18px 22px;
    box-shadow: var(--shadow);
    position: relative;
    border-left: 4px solid var(--gold);
  }
  .tip-card .tip-badge {
    display: inline-block;
    background: var(--gold);
    color: white;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 8px;
    font-family: 'Inter', sans-serif;
  }
  .tip-card .tip-title {
    font-family: 'Outfit', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    margin-bottom: 5px;
  }
  .tip-card .tip-body {
    font-size: 0.85rem;
    color: var(--text-muted);
    line-height: 1.55;
  }
  .tip-card .tip-action {
    display: inline-block;
    margin-top: 8px;
    font-size: 0.8rem;
    color: var(--accent);
    font-weight: 600;
  }
  @keyframes tip-in {
    0% { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .tip-card.new-tip { animation: tip-in 0.4s ease-out; }

  /* ── Toast ───────────────────────────────────── */
  .toast-container {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    background: #2C2416;
    color: white;
    padding: 10px 22px;
    border-radius: 24px;
    font-size: 0.85rem;
    font-weight: 500;
    text-align: center;
    box-shadow: 0 6px 24px rgba(0,0,0,0.18);
    animation: toast-in 0.3s ease-out, toast-out 0.25s 2s ease-in forwards;
    pointer-events: auto;
    font-family: 'Inter', sans-serif;
  }
  .toast.warning { background: var(--accent); }
  .toast.success { background: var(--green); }
  @keyframes toast-in {
    0% { opacity: 0; transform: translateY(-16px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes toast-out {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-16px); }
  }

  .reset-link {
    text-align: center;
    padding: 8px 20px 28px;
  }
  .reset-link button {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 0.75rem;
    cursor: pointer;
    text-decoration: underline;
    font-family: 'Inter', sans-serif;
  }
  .reset-link button:hover { color: var(--red); }
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <header class="header-bar">
    <div class="logo-area">
      <span class="logo-icon">🏠</span>
      <span class="logo-text">Your First <span>Flock</span></span>
    </div>
    <div class="header-stats">
      <div class="header-stat"><span class="hs-icon">📅</span> Day <span class="hs-val" id="hDay">1</span></div>
      <div class="header-stat"><span class="hs-icon">🥚</span> <span class="hs-val" id="hEggs">0</span> eggs</div>
      <div class="header-stat"><span class="hs-icon">🐔</span> <span class="hs-val" id="hFlock">3/3</span></div>
    </div>
    <div class="feed-indicator">Feed: <strong id="hFeed">10</strong> scoops</div>
  </header>

  <!-- Scene -->
  <div class="scene-wrapper">
    <div class="scene" id="sceneContainer">
      <!-- Static scene built by JS -->
    </div>
  </div>

  <!-- Action Bar -->
  <div class="action-bar" id="actionBar"></div>

  <!-- Tip -->
  <div class="tip-card new-tip" id="tipCard">
    <div class="tip-badge">🐣 Chicken Knowledge</div>
    <div class="tip-title" id="tipTitle"></div>
    <div class="tip-body" id="tipBody"></div>
    <div class="tip-action" id="tipAction"></div>
  </div>

  <div class="reset-link">
    <button onclick="resetGame()">Reset flock & start over</button>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
// ── Game State ──────────────────────────────────────────────
const CHICKEN_NAMES = ['Henrietta', 'Nugget', 'Cluckles', 'Eggwina', 'Pecky', 'Sunny', 'Daisy', 'Maple'];
const USED_NAMES = new Set();

const TIPS = [
  { title: 'Eggshells Are Mostly Calcium', body: 'A single eggshell contains about 2 grams of calcium. Without enough dietary calcium, hens produce thin-shelled or shell-less eggs.', action: '💡 Supplement: crushed oyster shells or limestone grit.' },
  { title: 'Chickens Need Grit to Digest', body: 'Chickens don\'t have teeth. They swallow small stones that sit in their gizzard, grinding food like a natural mill.', action: '💡 Provide coarse sand or commercial poultry grit.' },
  { title: 'A Hen Lays Every 24–26 Hours', body: 'It takes about 25 hours for a hen to form an egg. They lay slightly later each day, eventually skipping a day.', action: '💡 Expect 5–6 eggs per hen per week, not one daily.' },
  { title: 'Fresh Water > Food', body: 'A chicken can survive weeks without food but only days without water. A laying hen drinks about 2 cups per day.', action: '💡 Check waterers twice daily. Ice cubes in summer.' },
  { title: 'The Comb Reveals Health', body: 'A bright red, plump comb means a healthy, laying hen. Pale or shrunken combs signal illness or mites.', action: '💡 Quick comb check every time you collect eggs.' },
  { title: 'Dust Baths, Not Water Baths', body: 'Chickens clean themselves by fluffing dry dirt through their feathers — it smothers parasites and absorbs oil.', action: '💡 Provide dry dirt, sand, and a little wood ash.' },
  { title: 'Egg Color = Breed', body: 'White earlobes usually mean white eggs. Red earlobes usually mean brown eggs. Some breeds lay blue or green.', action: '💡 Ameraucana and Cream Legbar lay blue eggs.' },
  { title: 'Overfeeding Is Common', body: 'Obesity leads to fatty liver syndrome, egg-binding, and reduced laying. Most backyard flocks are overfed.', action: '💡 About ¼ lb of feed per hen per day. Limit treats.' },
  { title: 'Chickens Recognize Faces', body: 'Chickens recognize up to 100 faces, including humans. They form social hierarchies that last for months.', action: '💡 Spend time near your flock daily — they\'ll trust you.' },
  { title: 'The Bloom Protects Eggs', body: 'Fresh eggs have a natural coating called the "bloom" that seals the pores. Unwashed eggs last weeks at room temp.', action: '💡 Only wash eggs right before use, then refrigerate.' },
  { title: 'Body Temp: 105–107°F', body: 'That high metabolism means they need constant food and water. Extra feed before bedtime helps in cold weather.', action: '💡 Scratch grains or corn before bed on cold nights.' },
  { title: 'Molting = No Eggs', body: 'Once a year, hens shed and regrow feathers for 8–16 weeks. They stop laying entirely during molt.', action: '💡 Switch to higher-protein feed (18–20%) during molt.' },
  { title: 'Predators Come From All Sides', body: 'Hawks, raccoons, foxes, and weasels are top threats. A weasel can squeeze through a 1-inch gap.', action: '💡 Use ½-inch hardware cloth, buried 12 inches deep.' },
  { title: 'Yolk Color = Diet', body: 'Deep orange yolks come from carotenoids in marigolds, alfalfa, and leafy greens. Pale yolks = grain-only diet.', action: '💡 Free-range access to grass and bugs for rich yolks.' },
  { title: 'Descendants of Dinosaurs', body: 'Chickens descend from the Red Junglefowl. T. rex is closer to chickens than to Stegosaurus.', action: '💡 Your flock carries 150 million years of lineage.' },
];

let gameState = loadState();

function defaultState() {
  USED_NAMES.clear();
  return {
    day: 1, totalEggs: 0, feedSupply: 10,
    tipIndex: 0, usedTips: [],
    selectedChicken: null,
    chickens: [
      { name: pickName(), health: 100, hunger: 25, thirst: 20, eggTimer: 10, eggsLaid: 0 },
      { name: pickName(), health: 100, hunger: 20, thirst: 30, eggTimer: 50, eggsLaid: 0 },
      { name: pickName(), health: 100, hunger: 30, thirst: 15, eggTimer: 75, eggsLaid: 0 },
    ]
  };
}

function pickName() {
  const avail = CHICKEN_NAMES.filter(n => !USED_NAMES.has(n));
  const name = avail.length ? avail[Math.floor(Math.random() * avail.length)] : 'Chicky';
  USED_NAMES.add(name);
  return name;
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem('your-first-flock-v3'));
    if (s) { s.chickens.forEach(c => USED_NAMES.add(c.name)); return s; }
  } catch(e) {}
  return defaultState();
}

function saveState() {
  localStorage.setItem('your-first-flock-v3', JSON.stringify(gameState));
}

function resetGame() {
  gameState = defaultState();
  saveState();
  renderAll();
  toast('Fresh flock! 🐣', 'success');
}

// ── Game Logic ──────────────────────────────────────────────
function advanceTime(ticks) {
  for (const c of gameState.chickens) {
    if (c.health <= 0) continue;
    c.hunger = Math.min(100, c.hunger + ticks * 2);
    c.thirst = Math.min(100, c.thirst + ticks * 3);
    if (c.hunger >= 80 || c.thirst >= 80) c.health = Math.max(0, c.health - ticks * 2);
    c.eggTimer = Math.min(100, c.eggTimer + ticks * 3);
  }
  gameState.day += Math.floor(ticks / 5);
}

function feedChicken(index) {
  const c = gameState.chickens[index];
  if (c.health <= 0) return toast(`${c.name} is gone. 😢`, 'warning');
  if (gameState.feedSupply <= 0) return toast('Out of feed! Buy more. 🏪', 'warning');
  gameState.feedSupply--;
  c.hunger = Math.max(0, c.hunger - 35);
  if (c.hunger < 30 && c.health < 100 && c.thirst < 80) c.health = Math.min(100, c.health + 3);
  advanceTime(2);
  saveState(); renderAll(); showRandomTip();
  toast(`Fed ${c.name}!`, 'success');
}

function waterChicken(index) {
  const c = gameState.chickens[index];
  if (c.health <= 0) return toast(`${c.name} is gone. 😢`, 'warning');
  c.thirst = Math.max(0, c.thirst - 40);
  if (c.thirst < 30 && c.health < 100 && c.hunger < 80) c.health = Math.min(100, c.health + 3);
  advanceTime(2);
  saveState(); renderAll(); showRandomTip();
  toast(`Watered ${c.name}!`, 'success');
}

function collectEggs(index) {
  const c = gameState.chickens[index];
  if (c.health <= 0) return toast(`${c.name} is gone. 😢`, 'warning');
  if (c.eggTimer < 80) return toast(`${c.name} isn't ready to lay. ⏳`, 'warning');
  c.eggTimer = 0;
  c.eggsLaid++;
  gameState.totalEggs++;
  advanceTime(2);
  saveState(); renderAll(); showRandomTip();
  toast(`🥚 +1 egg from ${c.name}!`, 'success');
}

function feedAll() {
  if (gameState.feedSupply <= 0) return toast('Out of feed! Buy more. 🏪', 'warning');
  const alive = gameState.chickens.filter(c => c.health > 0);
  if (alive.length === 0) return toast('No chickens to feed. 😢', 'warning');
  const needed = Math.min(gameState.feedSupply, alive.length);
  gameState.feedSupply -= needed;
  alive.slice(0, needed).forEach(c => {
    c.hunger = Math.max(0, c.hunger - 30);
    if (c.hunger < 30 && c.health < 100) c.health = Math.min(100, c.health + 3);
  });
  advanceTime(3);
  saveState(); renderAll(); showRandomTip();
  toast(`Fed ${needed} chicken(s)! 🍽️`, 'success');
}

function waterAll() {
  const alive = gameState.chickens.filter(c => c.health > 0);
  if (alive.length === 0) return toast('No chickens to water. 😢', 'warning');
  alive.forEach(c => {
    c.thirst = Math.max(0, c.thirst - 35);
    if (c.thirst < 30 && c.health < 100) c.health = Math.min(100, c.health + 3);
  });
  advanceTime(3);
  saveState(); renderAll(); showRandomTip();
  toast('Watered all chickens! 💧', 'success');
}

function collectAll() {
  const ready = gameState.chickens.filter(c => c.health > 0 && c.eggTimer >= 80);
  if (ready.length === 0) return toast('No eggs ready yet. ⏳', 'warning');
  ready.forEach(c => { c.eggTimer = 0; c.eggsLaid++; gameState.totalEggs++; });
  advanceTime(3);
  saveState(); renderAll(); showRandomTip();
  toast(`Collected ${ready.length} egg(s)! 🥚`, 'success');
}

function buyFeed() {
  gameState.feedSupply += 10;
  saveState(); renderAll();
  toast('Bought 10 scoops! 🛒', 'success');
}

function selectChicken(index) {
  gameState.selectedChicken = gameState.selectedChicken === index ? null : index;
  renderAll();
}

// ── Tips ────────────────────────────────────────────────────
function showRandomTip() {
  const avail = TIPS.map((_, i) => i).filter(i => !gameState.usedTips.includes(i));
  if (avail.length === 0) { gameState.usedTips = []; return showRandomTip(); }
  gameState.tipIndex = avail[Math.floor(Math.random() * avail.length)];
  gameState.usedTips.push(gameState.tipIndex);
}

// ── Scene Render (flat layout, no perspective transform) ───
function renderScene() {
  const container = document.getElementById('sceneContainer');
  const gs = gameState;
  const aliveChickens = gs.chickens.filter(c => c.health > 0);

  // Build static base HTML
  container.innerHTML = `
    <!-- Sky -->
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>

    <!-- Ground -->
    <div class="ground-plane">
      <div class="grass-texture"></div>
    </div>

    <!-- Fence boundary -->
    <div class="fence-area" id="fenceArea"></div>
  `;

  // Add fence posts along the boundary
  const fenceArea = container.querySelector('#fenceArea');
  const postPositions = [
    { top: '0%', left: '0%' },
    { top: '0%', left: '25%' },
    { top: '0%', left: '50%' },
    { top: '0%', left: '75%' },
    { top: '0%', left: '100%', style: 'transform:translateX(-9px)' },
    { top: '50%', left: '0%' },
    { top: '50%', left: '100%', style: 'transform:translateX(-9px)' },
  ];
  postPositions.forEach(p => {
    const post = document.createElement('div');
    post.className = 'fence-post-el';
    post.style.cssText = `top:${p.top};left:${p.left};height:30px;${p.style||''}`;
    container.appendChild(post);
  });

  // Coop structure (left side, inside fence)
  const coop = document.createElement('div');
  coop.className = 'coop-structure';
  coop.style.cssText = 'position:absolute;top:29%;left:5%;width:42%;height:36%;z-index:3;pointer-events:none;';
  coop.innerHTML = `
    <span class="coop-label">COOP</span>
    <div class="coop-roof-slant"></div>
    <div class="coop-back-wall"></div>
  `;
  container.appendChild(coop);

  // Nesting boxes row (inside coop, bottom of coop area)
  const nestRow = document.createElement('div');
  nestRow.className = 'nesting-boxes-row';
  nestRow.style.cssText = 'position:absolute;top:58%;left:7%;z-index:11;pointer-events:auto;';
  // Label above nesting boxes
  const nestLabel = document.createElement('div');
  nestLabel.className = 'nest-row-label';
  nestLabel.textContent = 'Nesting Boxes';
  nestLabel.style.cssText = 'position:absolute;top:-22px;left:50%;transform:translateX(-50%);background:rgba(44,36,22,0.85);color:white;padding:3px 10px;border-radius:10px;font-family:Inter,sans-serif;font-weight:600;font-size:0.65rem;white-space:nowrap;pointer-events:none;z-index:12;';
  nestRow.appendChild(nestLabel);

  gs.chickens.forEach((c, i) => {
    if (c.health <= 0) return;
    const box = document.createElement('div');
    box.className = 'nest-box' + (c.eggTimer >= 80 ? ' has-egg' : '');
    box.innerHTML = `
      <span class="egg-in-nest">🥚</span>
      <span class="hen-label">${c.name.split(' ')[0]}</span>
    `;
    box.title = `Collect egg from ${c.name}`;
    box.onclick = (e) => { e.stopPropagation(); collectEggs(i); };
    nestRow.appendChild(box);
  });
  container.appendChild(nestRow);

  // Waterer (right side of coop interior, below nesting boxes)
  const waterer = document.createElement('div');
  waterer.className = 'waterer-prop prop';
  waterer.style.cssText = 'position:absolute;top:56%;right:10%;z-index:11;cursor:pointer;';
  waterer.innerHTML = `
    <div class="waterer-body">💧</div>
    <div class="prop-label">WATER</div>
  `;
  waterer.onclick = (e) => { e.stopPropagation(); waterAll(); };
  container.appendChild(waterer);

  // Feed trough (middle of the run area, below the coop)
  const trough = document.createElement('div');
  trough.className = 'feed-trough-prop prop';
  trough.style.cssText = 'position:absolute;top:72%;left:50%;transform:translateX(-50%);z-index:11;cursor:pointer;';
  trough.innerHTML = `
    <div class="trough-body"></div>
    <div class="prop-label">FEED TROUGH</div>
  `;
  trough.onclick = (e) => { e.stopPropagation(); feedAll(); };
  container.appendChild(trough);

  // Chickens — positioned with clear spacing, no overlapping props
  // Chicken positions: spread across the open run area
  const chickenLayouts = [
    { top: '44%', left: '18%', anim: 'chicken-anim-idle' },   // far left, in run
    { top: '47%', left: '48%', anim: 'chicken-anim-peck' },   // center
    { top: '43%', left: '72%', anim: 'chicken-anim-idle' },   // right side, well away from waterer
  ];

  gs.chickens.forEach((c, i) => {
    if (c.health <= 0) return;
    const pos = chickenLayouts[i] || { top: '45%', left: '50%', anim: 'chicken-anim-idle' };
    const sel = gs.selectedChicken === i;

    // Determine health dot color
    let dotClass = 'good';
    if (c.health < 30 || c.hunger >= 80 || c.thirst >= 80) dotClass = 'bad';
    else if (c.health < 60 || c.hunger >= 50 || c.thirst >= 50) dotClass = 'ok';

    const sprite = document.createElement('div');
    sprite.className = 'chicken-sprite' + (sel ? ' selected' : '');
    sprite.style.cssText = `position:absolute;top:${pos.top};left:${pos.left};z-index:${sel ? 14 : 9};cursor:pointer;`;
    sprite.innerHTML = `
      <div class="health-dot ${dotClass}"></div>
      <div class="chicken-name-tag">${c.name}</div>
      <div class="chicken-body ${pos.anim}">
        <div class="chicken-head">
          <div class="chicken-comb"></div>
          <div class="chicken-eye"></div>
          <div class="chicken-beak"></div>
        </div>
        <div class="chicken-wattle"></div>
      </div>
      <div class="chicken-legs">
        <div class="chicken-leg"></div>
        <div class="chicken-leg"></div>
      </div>
    `;
    sprite.onclick = (e) => { e.stopPropagation(); selectChicken(i); };
    container.appendChild(sprite);
  });

  // Popup for selected chicken
  if (gs.selectedChicken !== null) {
    const c = gs.chickens[gs.selectedChicken];
    const pos = chickenLayouts[gs.selectedChicken] || { top: '45%', left: '50%' };
    const popup = document.createElement('div');
    popup.className = 'chicken-popup';
    // Position popup near the chicken but offset to avoid covering it
    const leftPct = parseFloat(pos.left);
    const popupLeft = leftPct < 40 ? `calc(${pos.left} + 60px)` : `calc(${pos.left} - 220px)`;
    popup.style.cssText = `position:absolute;top:${pos.top};left:${popupLeft};z-index:25;pointer-events:auto;`;

    const eggReady = c.eggTimer >= 80;
    popup.innerHTML = `
      <button class="close-popup" onclick="event.stopPropagation();gameState.selectedChicken=null;renderAll();">×</button>
      <div class="popup-name">${c.name} 🐔</div>
      <div class="popup-stat">Health <div class="popup-bar"><div class="popup-bar-fill health-bar" style="width:${c.health}%"></div></div></div>
      <div class="popup-stat">Hunger <div class="popup-bar"><div class="popup-bar-fill hunger-bar" style="width:${c.hunger}%"></div></div></div>
      <div class="popup-stat">Thirst <div class="popup-bar"><div class="popup-bar-fill thirst-bar" style="width:${c.thirst}%"></div></div></div>
      <div class="popup-stat" style="font-size:0.72rem;">🥚 ${c.eggsLaid} eggs laid${eggReady ? ' — Ready!' : ''}</div>
      <div class="popup-actions">
        <button class="mini-btn" onclick="event.stopPropagation();feedChicken(${gs.selectedChicken})">🍽️ Feed</button>
        <button class="mini-btn" onclick="event.stopPropagation();waterChicken(${gs.selectedChicken})">💧 Water</button>
        <button class="mini-btn ${eggReady ? 'primary' : ''}" onclick="event.stopPropagation();collectEggs(${gs.selectedChicken})" ${!eggReady ? 'disabled' : ''}>🥚 Collect</button>
      </div>
    `;
    container.appendChild(popup);
  }

  // Click background to deselect
  container.querySelector('.ground-plane').onclick = () => {
    if (gameState.selectedChicken !== null) {
      gameState.selectedChicken = null;
      renderAll();
    }
  };
}

// ── Full Render ─────────────────────────────────────────────
function renderAll() {
  const gs = gameState;
  const alive = gs.chickens.filter(c => c.health > 0);

  // Header stats
  document.getElementById('hDay').textContent = gs.day;
  document.getElementById('hEggs').textContent = gs.totalEggs;
  document.getElementById('hFlock').textContent = `${alive.length}/${gs.chickens.length}`;
  document.getElementById('hFeed').textContent = gs.feedSupply;

  // Scene
  renderScene();

  // Action bar
  const hasFeed = gs.feedSupply > 0;
  const hasAlive = alive.length > 0;
  const anyEggReady = alive.some(c => c.eggTimer >= 80);

  document.getElementById('actionBar').innerHTML = `
    <button class="action-btn" onclick="feedAll()" ${!hasFeed || !hasAlive ? 'disabled' : ''}>
      <span class="btn-icon">🍽️</span> Feed All
    </button>
    <button class="action-btn" onclick="waterAll()" ${!hasAlive ? 'disabled' : ''}>
      <span class="btn-icon">💧</span> Water All
    </button>
    <button class="action-btn ${anyEggReady ? 'primary-btn' : ''}" onclick="collectAll()" ${!anyEggReady ? 'disabled' : ''}>
      <span class="btn-icon">🥚</span> Collect All Eggs
    </button>
    <button class="action-btn" onclick="buyFeed()">
      <span class="btn-icon">🛒</span> Buy Feed (+10)
    </button>
  `;

  // Tip card
  const tip = TIPS[gs.tipIndex % TIPS.length];
  document.getElementById('tipTitle').textContent = tip.title;
  document.getElementById('tipBody').textContent = tip.body;
  document.getElementById('tipAction').textContent = tip.action;
  const card = document.getElementById('tipCard');
  card.classList.remove('new-tip');
  void card.offsetWidth;
  card.classList.add('new-tip');
}

// ── Toast ───────────────────────────────────────────────────
function toast(msg, type) {
  const ctr = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  ctr.appendChild(el);
  setTimeout(() => el.remove(), 2400);
}

// ── Init ────────────────────────────────────────────────────
renderAll();

// Passive decay
setInterval(() => {
  advanceTime(1);
  saveState();
  renderAll();
}, 25000);
</script>

</body>
</html>
