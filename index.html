<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your First Flock — Chicken Care Game</title>
<style>
  :root {
    --cream: #FEF9F0;
    --warm-white: #FFFBF5;
    --card-bg: #FFFFFF;
    --text: #3D2B1F;
    --text-muted: #8B7355;
    --gold: #C4956A;
    --gold-light: #E8D5B7;
    --green: #6B8F71;
    --green-light: #A8C9A5;
    --red: #C46B5C;
    --red-light: #F0C4BB;
    --blue: #5B8BA0;
    --blue-light: #B8D4DE;
    --terracotta: #C67B5C;
    --border: #E8DDD0;
    --shadow: 0 2px 12px rgba(61, 43, 31, 0.06);
    --shadow-hover: 0 4px 20px rgba(61, 43, 31, 0.10);
    --radius: 16px;
    --radius-sm: 10px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-display: 'Georgia', 'Times New Roman', serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--font);
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 20px;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(212, 165, 116, 0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 100%, rgba(107, 143, 113, 0.06) 0%, transparent 60%);
  }

  .app {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* Header */
  .header {
    text-align: center;
    padding: 28px 20px 16px;
  }
  .header .logo {
    font-family: var(--font-display);
    font-size: 2rem;
    font-weight: bold;
    color: var(--text);
    letter-spacing: -0.3px;
  }
  .header .logo span { color: var(--terracotta); }
  .header .subtitle {
    color: var(--text-muted);
    font-size: 0.9rem;
    margin-top: 4px;
  }

  /* Stats Bar */
  .stats-bar {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .stat-card {
    flex: 1;
    min-width: 100px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .stat-card .stat-value {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--text);
    font-family: var(--font-display);
  }
  .stat-card .stat-label {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-top: 2px;
  }

  /* Flock Section */
  .section-title {
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }

  .flock {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .chicken-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.2s, transform 0.2s;
    display: grid;
    grid-template-columns: 60px 1fr;
    gap: 16px;
    align-items: center;
    cursor: default;
  }
  .chicken-card:hover {
    box-shadow: var(--shadow-hover);
  }
  .chicken-card.sick {
    border-color: var(--red-light);
  }

  .chicken-avatar {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--gold-light);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.2rem;
    position: relative;
    animation: chicken-bob 2s ease-in-out infinite;
    transition: background 0.3s;
  }
  .chicken-card.sick .chicken-avatar {
    background: var(--red-light);
    animation: chicken-sick 0.6s ease-in-out infinite;
  }
  .egg-ready .chicken-avatar::after {
    content: '🥚';
    position: absolute;
    bottom: -6px;
    right: -6px;
    font-size: 1.1rem;
    animation: egg-pop 0.4s ease-out;
  }
  @keyframes chicken-bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @keyframes chicken-sick {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-2px); }
    75% { transform: translateX(2px); }
  }
  @keyframes egg-pop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.3); }
    100% { transform: scale(1); opacity: 1; }
  }

  .chicken-info {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .chicken-name {
    font-weight: 600;
    font-size: 1rem;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .chicken-name .egg-count {
    font-size: 0.78rem;
    color: var(--gold);
    font-weight: 500;
  }
  .chicken-status {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-style: italic;
  }

  .bar-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.72rem;
    color: var(--text-muted);
  }
  .bar-row .bar-label {
    width: 42px;
    text-align: right;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .bar-track {
    flex: 1;
    height: 7px;
    background: var(--gold-light);
    border-radius: 10px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 10px;
    transition: width 0.5s ease;
  }
  .bar-fill.hunger { background: var(--gold); }
  .bar-fill.thirst { background: var(--blue); }
  .bar-fill.health { background: var(--green); }
  .bar-fill.danger { background: var(--red); }

  /* Actions */
  .actions {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
  }
  .btn {
    padding: 14px 18px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover:not(:disabled) {
    box-shadow: var(--shadow-hover);
    transform: translateY(-1px);
  }
  .btn:active:not(:disabled) {
    transform: translateY(0);
    box-shadow: var(--shadow);
  }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .btn.primary {
    background: var(--gold);
    border-color: var(--gold);
    color: white;
    font-weight: 600;
  }
  .btn.primary:hover:not(:disabled) {
    background: #B8875D;
    border-color: #B8875D;
  }
  .btn .btn-icon { font-size: 1.3rem; }

  /* Feed supply indicator */
  .feed-supply {
    text-align: center;
    font-size: 0.78rem;
    color: var(--text-muted);
    padding: 4px;
  }
  .feed-supply strong { color: var(--text); }

  /* Tip Card */
  .tip-card {
    background: linear-gradient(135deg, #FFF8EC, #FFFBF5);
    border: 1px solid var(--gold-light);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }
  .tip-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px;
    height: 100%;
    background: var(--gold);
    border-radius: 4px 0 0 4px;
  }
  .tip-card .tip-badge {
    display: inline-block;
    background: var(--gold);
    color: white;
    font-size: 0.68rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
  }
  .tip-card .tip-title {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 1.05rem;
    margin-bottom: 6px;
    color: var(--text);
  }
  .tip-card .tip-body {
    font-size: 0.9rem;
    color: var(--text-muted);
    line-height: 1.55;
  }
  .tip-card .tip-action {
    display: inline-block;
    margin-top: 10px;
    font-size: 0.82rem;
    color: var(--terracotta);
    font-weight: 600;
  }
  @keyframes tip-in {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .tip-card.new-tip { animation: tip-in 0.4s ease-out; }

  /* Reset button */
  .reset-area {
    text-align: center;
    padding-top: 8px;
  }
  .btn-reset {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 0.75rem;
    cursor: pointer;
    text-decoration: underline;
    padding: 8px;
  }
  .btn-reset:hover { color: var(--red); }

  /* Toast */
  .toast-container {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    background: var(--text);
    color: white;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 0.88rem;
    font-weight: 500;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
    animation: toast-in 0.35s ease-out, toast-out 0.3s 2.2s ease-in forwards;
    pointer-events: auto;
  }
  .toast.warning { background: var(--terracotta); }
  .toast.success { background: var(--green); }
  @keyframes toast-in {
    0% { opacity: 0; transform: translateY(-20px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes toast-out {
    0% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-20px); }
  }

  /* Mobile */
  @media (max-width: 480px) {
    .header .logo { font-size: 1.55rem; }
    .stats-bar { gap: 8px; }
    .stat-card { padding: 10px 12px; }
    .stat-card .stat-value { font-size: 1.3rem; }
    .chicken-card {
      grid-template-columns: 48px 1fr;
      padding: 14px;
      gap: 12px;
    }
    .chicken-avatar { width: 48px; height: 48px; font-size: 1.8rem; }
    .actions { grid-template-columns: 1fr 1fr; }
    .btn { padding: 12px 14px; font-size: 0.82rem; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- Header -->
  <header class="header">
    <div class="logo">Your First <span>Flock</span></div>
    <div class="subtitle">Learn to care for your chickens, one day at a time 🐔</div>
  </header>

  <!-- Stats Bar -->
  <div class="stats-bar" id="statsBar"></div>

  <!-- Flock -->
  <div style="display:flex;justify-content:space-between;align-items:baseline;">
    <div class="section-title">🐔 Your Flock</div>
    <div class="feed-supply">Feed supply: <strong id="feedSupply">10</strong> scoops</div>
  </div>
  <div class="flock" id="flockContainer"></div>

  <!-- Actions -->
  <div class="actions" id="actionsContainer"></div>

  <!-- Did You Know? -->
  <div class="tip-card new-tip" id="tipCard">
    <div class="tip-badge">🐣 Chicken Knowledge</div>
    <div class="tip-title" id="tipTitle"></div>
    <div class="tip-body" id="tipBody"></div>
    <div class="tip-action" id="tipAction"></div>
  </div>

  <!-- Reset -->
  <div class="reset-area">
    <button class="btn-reset" onclick="resetGame()">Reset flock & start over</button>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ── Game State ──────────────────────────────────────────────
const CHICKEN_NAMES = ['Henrietta', 'Nugget', 'Cluckles', 'Eggwina', 'Pecky', 'Feathers', 'Sunny', 'Daisy'];
const USED_NAMES = new Set();

const TIPS = [
  {
    title: 'Eggshells Are Mostly Calcium',
    body: 'A single eggshell contains about 2 grams of calcium. If your hens don\'t get enough calcium in their diet, they\'ll produce thin-shelled or shell-less eggs.',
    action: '💡 Supplement: crushed oyster shells or limestone grit in their feed.'
  },
  {
    title: 'Chickens Need Grit to Digest Food',
    body: 'Chickens don\'t have teeth. They swallow small stones and grit that sit in their gizzard, grinding up food like a natural mill.',
    action: '💡 Fix: provide coarse sand or commercial poultry grit — especially if they eat anything besides commercial feed.'
  },
  {
    title: 'A Hen Lays Every 24–26 Hours',
    body: 'It takes about 25 hours for a hen to form an egg. That\'s why they tend to lay slightly later each day, eventually skipping a day.',
    action: '💡 Expect about 5–6 eggs per hen per week, not one every single day.'
  },
  {
    title: 'Fresh Water Is More Important Than Food',
    body: 'A chicken can survive weeks without food but only days without water. A laying hen drinks about 2 cups of water per day — more in hot weather.',
    action: '💡 Fix: check waterers twice daily. In summer, add ice cubes. In winter, use a heated waterer base.'
  },
  {
    title: 'The Comb Tells You About Health',
    body: 'A bright red, plump comb usually means a healthy, laying hen. A pale, shrunken, or discolored comb can signal illness, mites, or that she\'s stopped laying.',
    action: '💡 Do a quick comb check every time you collect eggs.'
  },
  {
    title: 'Chickens Take Dust Baths — Not Water Baths',
    body: 'Chickens clean themselves by fluffing dry dirt or sand through their feathers. It smothers parasites like mites and absorbs excess oil.',
    action: '💡 Provide a dry area with fine dirt, sand, and a little wood ash — they\'ll do the rest.'
  },
  {
    title: 'Egg Color Depends on the Breed',
    body: 'White earlobes usually mean white eggs. Red earlobes usually mean brown eggs. Some breeds lay blue, green, or even chocolate-colored eggs.',
    action: '💡 Fun fact: the Ameraucana and Cream Legbar breeds lay blue eggs naturally.'
  },
  {
    title: 'Overfeeding Is a Real Problem',
    body: 'Obesity in hens leads to fatty liver syndrome, egg-binding, and reduced laying. Most backyard flocks are overfed, not underfed.',
    action: '💡 Fix: measure feed — about ¼ lb per hen per day. Limit treats to 10% of their diet.'
  },
  {
    title: 'Chickens Recognize Each Other — and You',
    body: 'Chickens can recognize up to 100 individual faces, including human ones. They form social hierarchies (the "pecking order") and remember it for months.',
    action: '💡 Spend time near your flock daily — they\'ll learn to trust you.'
  },
  {
    title: 'Eggs Don\'t Need Refrigeration — At First',
    body: 'Freshly laid eggs have a natural protective coating called the "bloom" that seals the pores. Unwashed eggs stay fresh at room temperature for weeks.',
    action: '💡 Only wash eggs right before using them. Once washed, refrigerate within 2 hours.'
  },
  {
    title: 'A Chicken\'s Body Temp Is 105–107°F',
    body: 'That\'s hotter than a human\'s 98.6°F. This high metabolism is why they need constant access to food and water — they burn through energy fast.',
    action: '💡 In cold weather, extra feed (especially corn/scratch before bedtime) helps them stay warm overnight.'
  },
  {
    title: 'Molting Shuts Down Egg Production',
    body: 'Once a year, hens shed and regrow their feathers. During this 8–16 week molting period, they stop laying entirely — all their protein goes to feathers.',
    action: '💡 Switch to a higher-protein feed (18–20%) during molt to speed up recovery.'
  },
  {
    title: 'Predators Attack From Above and Below',
    body: 'Hawks, owls, raccoons, foxes, and weasels are the top chicken predators. A weasel can squeeze through a 1-inch gap.',
    action: '💡 Use ½-inch hardware cloth (not chicken wire) and bury it 12 inches deep around the coop.'
  },
  {
    title: 'The Yolk Color Comes From Diet',
    body: 'Deep orange yolks come from carotenoids in plants like marigolds, alfalfa, and leafy greens. Pale yellow yolks usually mean a grain-only diet.',
    action: '💡 Free-range access to grass and bugs gives you those Instagram-worthy orange yolks.'
  },
  {
    title: 'Chickens Are Descendants of Dinosaurs',
    body: 'Specifically, the Red Junglefowl of Southeast Asia. The T. rex is actually a closer relative to chickens than to other dinosaurs like the Stegosaurus.',
    action: '💡 Next time someone calls your chicken a "tiny dinosaur," they\'re scientifically correct.'
  },
];

let gameState = loadState();

function defaultState() {
  return {
    day: 1,
    totalEggs: 0,
    feedSupply: 10,
    tipIndex: 0,
    usedTips: [],
    chickens: [
      { name: pickName(), health: 100, hunger: 20, thirst: 20, eggTimer: 0, eggsLaid: 0 },
      { name: pickName(), health: 100, hunger: 25, thirst: 15, eggTimer: 40, eggsLaid: 0 },
      { name: pickName(), health: 100, hunger: 15, thirst: 25, eggTimer: 70, eggsLaid: 0 },
    ]
  };
}

function pickName() {
  const available = CHICKEN_NAMES.filter(n => !USED_NAMES.has(n));
  const name = available.length > 0 ? available[Math.floor(Math.random() * available.length)] : 'Chicky';
  USED_NAMES.add(name);
  return name;
}

function loadState() {
  try {
    const saved = localStorage.getItem('your-first-flock');
    if (saved) {
      const s = JSON.parse(saved);
      s.chickens.forEach(c => USED_NAMES.add(c.name));
      return s;
    }
  } catch(e) {}
  return defaultState();
}

function saveState() {
  localStorage.setItem('your-first-flock', JSON.stringify(gameState));
}

function resetGame() {
  USED_NAMES.clear();
  gameState = defaultState();
  saveState();
  render();
  toast('Flock reset! Fresh start. 🐣', 'success');
}

// ── Game Logic ──────────────────────────────────────────────
function advanceTime(ticks) {
  for (const c of gameState.chickens) {
    if (c.health <= 0) continue;
    c.hunger = Math.min(100, c.hunger + ticks * 3);
    c.thirst = Math.min(100, c.thirst + ticks * 4);
    if (c.hunger >= 85 || c.thirst >= 85) {
      c.health = Math.max(0, c.health - ticks * 2);
    }
    c.eggTimer = Math.min(100, c.eggTimer + ticks * 4);
  }
  gameState.day += Math.floor(ticks / 4);
}

function feedChicken(index) {
  const c = gameState.chickens[index];
  if (c.health <= 0) return toast(`${c.name} has passed away. 😢 Start a new flock.`, 'warning');
  if (gameState.feedSupply <= 0) return toast('Out of feed! Buy more at the supply shop. 🏪', 'warning');
  gameState.feedSupply--;
  c.hunger = Math.max(0, c.hunger - 35);
  if (c.hunger < 30 && c.health < 100 && c.thirst < 80) c.health = Math.min(100, c.health + 5);
  advanceTime(2);
  saveState();
  render();
  showRandomTip();
  toast(`Fed ${c.name}! 🍽️`, 'success');
}

function waterChicken(index) {
  const c = gameState.chickens[index];
  if (c.health <= 0) return toast(`${c.name} has passed away. 😢`, 'warning');
  c.thirst = Math.max(0, c.thirst - 40);
  if (c.thirst < 30 && c.health < 100 && c.hunger < 80) c.health = Math.min(100, c.health + 5);
  advanceTime(2);
  saveState();
  render();
  showRandomTip();
  toast(`Watered ${c.name}! 💧`, 'success');
}

function collectEggs(index) {
  const c = gameState.chickens[index];
  if (c.health <= 0) return toast(`${c.name} has passed away. 😢`, 'warning');
  if (c.eggTimer < 80) return toast(`${c.name} isn't ready to lay yet. ⏳`, 'warning');
  c.eggTimer = 0;
  c.eggsLaid++;
  gameState.totalEggs++;
  advanceTime(2);
  saveState();
  render();
  showRandomTip();
  toast(`Collected an egg from ${c.name}! 🥚`, 'success');
}

function buyFeed() {
  gameState.feedSupply += 10;
  saveState();
  render();
  toast('Bought 10 scoops of feed! 🛒', 'success');
}

// ── Tips ────────────────────────────────────────────────────
function showRandomTip() {
  const available = TIPS.filter((_, i) => !gameState.usedTips.includes(i));
  if (available.length === 0) { gameState.usedTips = []; return showRandomTip(); }
  const idx = TIPS.indexOf(available[Math.floor(Math.random() * available.length)]);
  gameState.usedTips.push(idx);
  gameState.tipIndex = idx;
  saveState();
  renderTip(idx);
}

// ── Render ──────────────────────────────────────────────────
function render() {
  const gs = gameState;

  // Stats
  const alive = gs.chickens.filter(c => c.health > 0);
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-card">
      <div class="stat-value">${gs.day}</div>
      <div class="stat-label">Day</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${gs.totalEggs}</div>
      <div class="stat-label">Eggs Collected</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${alive.length}/${gs.chickens.length}</div>
      <div class="stat-label">Flock Health</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${Math.round(alive.reduce((s, c) => s + c.health, 0) / Math.max(1, alive.length))}%</div>
      <div class="stat-label">Avg Health</div>
    </div>
  `;

  document.getElementById('feedSupply').textContent = gs.feedSupply;

  // Flock
  document.getElementById('flockContainer').innerHTML = gs.chickens.map((c, i) => {
    const dead = c.health <= 0;
    const eggReady = c.eggTimer >= 80 && !dead;
    const sick = !dead && (c.hunger >= 85 || c.thirst >= 85 || c.health < 30);
    const healthClass = c.health < 30 ? 'danger' : 'health';
    const hungerClass = c.hunger >= 85 ? 'danger' : 'hunger';
    const thirstClass = c.thirst >= 85 ? 'danger' : 'thirst';

    let status = dead ? '💀 Passed away' :
      sick ? '🤒 Needs attention!' :
      eggReady ? '🥚 Ready to lay!' :
      c.hunger > 60 ? '🍽️ Getting hungry' :
      c.thirst > 60 ? '💧 Getting thirsty' :
      '😊 Healthy';

    return `
      <div class="chicken-card ${sick ? 'sick' : ''} ${eggReady ? 'egg-ready' : ''}">
        <div class="chicken-avatar">${dead ? '💀' : '🐔'}</div>
        <div class="chicken-info">
          <div class="chicken-name">${c.name} <span class="egg-count">🥚 ${c.eggsLaid} eggs</span></div>
          <div class="chicken-status">${status}</div>
          <div class="bar-group">
            <div class="bar-row">
              <span class="bar-label">Health</span>
              <div class="bar-track"><div class="bar-fill ${healthClass}" style="width:${dead ? 0 : c.health}%"></div></div>
            </div>
            <div class="bar-row">
              <span class="bar-label">Hunger</span>
              <div class="bar-track"><div class="bar-fill ${hungerClass}" style="width:${dead ? 100 : c.hunger}%"></div></div>
            </div>
            <div class="bar-row">
              <span class="bar-label">Thirst</span>
              <div class="bar-track"><div class="bar-fill ${thirstClass}" style="width:${dead ? 100 : c.thirst}%"></div></div>
            </div>
          </div>
        </div>
      </div>
    `;
  }).join('');

  // Actions
  document.getElementById('actionsContainer').innerHTML = gs.chickens.map((c, i) => {
    if (c.health <= 0) return '';
    const eggReady = c.eggTimer >= 80;
    return `
      <button class="btn" onclick="feedChicken(${i})" ${gameState.feedSupply <= 0 ? 'disabled' : ''}>
        <span class="btn-icon">🍽️</span> Feed ${c.name.split(' ')[0]}
      </button>
      <button class="btn" onclick="waterChicken(${i})">
        <span class="btn-icon">💧</span> Water ${c.name.split(' ')[0]}
      </button>
      <button class="btn ${eggReady ? 'primary' : ''}" onclick="collectEggs(${i})" ${!eggReady ? 'disabled' : ''}>
        <span class="btn-icon">🥚</span> Collect Egg
      </button>
    `;
  }).join('') + `
    <button class="btn" onclick="buyFeed()" style="grid-column:1/-1;">
      <span class="btn-icon">🛒</span> Buy Feed (+10 scoops)
    </button>
  `;

  // Tip
  renderTip(gs.tipIndex);

  // Feed supply display
  document.getElementById('feedSupply').textContent = gs.feedSupply;
}

function renderTip(idx) {
  const tip = TIPS[idx % TIPS.length];
  document.getElementById('tipTitle').textContent = tip.title;
  document.getElementById('tipBody').textContent = tip.body;
  document.getElementById('tipAction').textContent = tip.action;

  // Re-trigger animation
  const card = document.getElementById('tipCard');
  card.classList.remove('new-tip');
  void card.offsetWidth;
  card.classList.add('new-tip');
}

// ── Toast ───────────────────────────────────────────────────
function toast(msg, type) {
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = `toast ${type || ''}`;
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

// ── Init ────────────────────────────────────────────────────
render();

// Decay loop: every 30 seconds, advance time by 1 tick
setInterval(() => {
  advanceTime(1);
  saveState();
  render();
}, 30000);
</script>

</body>
</html>
