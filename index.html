<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your First Flock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

:root{--wood:#F0E0CC;--salmon:#E57373;--gold:#F4B840;--text:#4A3028;--text-muted:#8B7060;--outline:#4A3028;--fd:"Baloo 2",cursive;--fb:"Nunito",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fb);background:#E8F4E8;color:var(--text);display:flex;justify-content:center;min-height:100vh}
.app{width:100%;max-width:960px;display:flex;flex-direction:column;min-height:100vh}
.header-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:linear-gradient(180deg,#F0E0CC,#E0CCB0);border-bottom:5px solid #8B6F4E;position:sticky;top:0;z-index:50;gap:10px;flex-wrap:wrap}
.logo-text{font-family:var(--fd);font-weight:800;font-size:1.5rem;color:var(--text);text-shadow:1px 1px 0 rgba(255,255,255,0.5)}
.logo-text .accent{color:var(--salmon)}
.header-stats{display:flex;gap:10px;align-items:center}
.stat-pill{display:flex;align-items:center;gap:6px;font-weight:700;font-size:0.88rem;color:var(--text);background:white;padding:6px 14px;border-radius:20px;border:2.5px solid var(--outline)}
.stat-pill .sp-val{font-family:var(--fd);font-size:1.15rem}
.coin-pill{font-weight:700;font-size:0.88rem;background:linear-gradient(135deg,#FFF8D0,#FFE8A0);padding:6px 14px;border-radius:20px;border:2.5px solid var(--outline)}
.coin-pill strong{font-family:var(--fd);font-size:1.15rem}
.feed-pill{font-weight:700;font-size:0.88rem;color:var(--text-muted);background:white;padding:6px 14px;border-radius:20px;border:2.5px solid var(--outline)}
.feed-pill strong{color:var(--text);font-family:var(--fd);font-size:1.15rem}
.hdr-store{font-family:var(--fb);font-weight:700;font-size:0.82rem;color:white;background:linear-gradient(180deg,#8B6F4E,#6B5030);padding:7px 16px;border-radius:12px;border:2.5px solid #4A3028;cursor:pointer;box-shadow:0 3px 0 #4A3028;transition:all 0.1s}
.hdr-store:hover{transform:translateY(-1px);box-shadow:0 4px 0 #4A3028}
.hdr-store:active{transform:translateY(2px);box-shadow:0 1px 0 #4A3028}
#game-canvas{margin:14px 20px 8px;border-radius:18px;border:4px solid var(--outline);box-shadow:0 5px 0 var(--outline),0 8px 24px rgba(74,48,40,0.12);display:block;width:100%}
.action-bar{display:flex;gap:10px;padding:0 20px;flex-wrap:wrap;justify-content:center}
.abtn{padding:14px 22px;border-radius:14px;border:3px solid var(--outline);font-size:0.88rem;font-weight:700;cursor:pointer;transition:all 0.1s;box-shadow:0 4px 0 var(--outline),inset 0 2px 0 rgba(255,255,255,0.4);display:flex;align-items:center;gap:7px;user-select:none;font-family:var(--fb);color:white}
.abtn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--outline),inset 0 2px 0 rgba(255,255,255,0.4)}
.abtn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--outline)}
.abtn:disabled{opacity:0.35;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--outline)}
.abtn.feed{background:linear-gradient(180deg,#F8C860,#E8A830)}
.abtn.water{background:linear-gradient(180deg,#8CC8E0,#4A98B8)}
.abtn.collect{background:linear-gradient(180deg,#F09090,#D46060)}
.abtn.shop{background:linear-gradient(180deg,#A0D0A0,#60A060)}
.abtn.store-b{background:linear-gradient(180deg,#D4A040,#B08020)}
.tip-card{margin:12px 20px 20px;background:white;border-radius:16px;padding:18px 22px;border:4px solid var(--outline);box-shadow:0 4px 0 var(--outline);position:relative}
.tip-card .tbadge{display:inline-block;background:var(--gold);color:white;font-weight:800;font-size:0.68rem;padding:4px 10px;border-radius:18px;border:2.5px solid var(--outline);text-transform:uppercase;margin-bottom:8px;font-family:var(--fb)}
.tip-card .ttitle{font-family:var(--fd);font-weight:700;font-size:1.05rem;margin-bottom:4px}
.tip-card .tbody{font-size:0.85rem;color:var(--text-muted);line-height:1.5;font-weight:600}
.tip-card .taction{display:inline-block;margin-top:8px;font-size:0.8rem;color:var(--salmon);font-weight:700}
.rst-area{text-align:center;padding:6px 20px 24px}
.rst-area button{background:none;border:none;color:var(--text-muted);font-family:var(--fb);font-size:0.76rem;font-weight:700;cursor:pointer;text-decoration:underline}
.store-overlay{position:fixed;inset:0;background:rgba(74,48,40,0.45);z-index:80;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}
.store-modal{background:white;border-radius:18px;border:5px solid var(--outline);box-shadow:0 8px 0 var(--outline),0 12px 40px rgba(74,48,40,0.25);padding:28px;max-width:580px;width:90%;max-height:85vh;overflow-y:auto;position:relative;font-family:var(--fb)}
.store-modal h2{font-family:var(--fd);font-size:1.5rem;margin-bottom:4px;text-align:center}
.store-coins{text-align:center;font-weight:700;color:var(--text-muted);margin-bottom:18px;font-size:0.95rem}
.store-coins strong{color:#C4902A;font-family:var(--fd);font-size:1.2rem}
.store-grid{display:flex;flex-direction:column;gap:10px}
.store-item{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;border:3px solid var(--outline);background:#FFFAF5;box-shadow:0 3px 0 var(--outline)}
.store-item.owned{opacity:0.55;pointer-events:none}
.store-icon{width:52px;height:52px;border-radius:12px;border:3px solid var(--outline);display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0}
.store-info{flex:1}.store-info .sin{font-family:var(--fd);font-weight:700;font-size:0.92rem;color:var(--text)}
.store-info .sid{font-size:0.74rem;color:var(--text-muted);margin-top:2px;font-weight:600}
.store-buy{padding:8px 18px;border-radius:10px;border:3px solid var(--outline);font-family:var(--fb);font-size:0.78rem;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--outline);background:white;white-space:nowrap}
.store-buy:disabled{opacity:0.4;cursor:not-allowed}
.store-close{position:absolute;top:12px;right:16px;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--text-muted);font-weight:700}
.toast-container{position:fixed;top:90px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#4A3028;color:white;padding:10px 22px;border-radius:22px;font-weight:700;font-size:0.85rem;text-align:center;border:3px solid var(--outline);box-shadow:0 4px 0 var(--outline);animation:tin 0.3s ease-out,tout 0.25s 2s ease-in forwards;pointer-events:auto;font-family:var(--fb)}
.toast.warn{background:var(--salmon)}.toast.ok{background:#8CC09A}
@keyframes tin{0%{opacity:0;transform:translateY(-14px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tout{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-14px)}}
</style>
</head>
<body>
<div class="app">
<header class="header-bar">
<div><span class="logo-text">Your First <span class="accent">Flock</span></span></div>
<div class="header-stats">
<div class="stat-pill">🥚 <span class="sp-val" id="hEggs">0</span></div>
<div class="coin-pill">🪙 <strong id="hCoins">0</strong></div>
<div class="feed-pill">🌾 <strong id="hFeed">10</strong></div>
</div>
<button class="hdr-store" onclick="openStore()">🛒 Store</button>
</header>
<div id="game-canvas"></div>
<div class="action-bar" id="actionBar"></div>
<div class="tip-card" id="tipCard"><div class="tbadge">🐣 Chicken Knowledge</div><div class="ttitle" id="tipTitle"></div><div class="tbody" id="tipBody"></div><div class="taction" id="tipAction"></div></div>
<div class="rst-area"><button onclick="resetGame()">Reset flock & start over</button></div>
</div>
<div class="toast-container" id="toastContainer"></div>

const NAMES=['Henrietta','Nugget','Cluckles','Eggwina','Pecky','Sunny','Daisy','Maple'];
const USED=new Set();
const TIPS=[{t:'Eggshells Are Mostly Calcium',b:'A single eggshell contains about 2 grams of calcium.',a:'💡 Supplement: crushed oyster shells or limestone grit.'},{t:'Chickens Need Grit',b:"Chickens don't have teeth. They swallow stones that grind food in their gizzard.",a:'💡 Provide coarse sand or poultry grit.'},{t:'A Hen Lays Every 24h',b:'It takes about 25 hours for a hen to form an egg.',a:'💡 Expect 5-6 eggs per hen per week.'},{t:'Fresh Water > Food',b:'A chicken drinks about 2 cups of water per day.',a:'💡 Check waterers twice daily.'},{t:'The Comb = Health',b:'A bright red comb means a healthy hen.',a:'💡 Quick comb check every egg collection.'}];
const UPGRADES=[{id:'feed',name:'Premium Feed',desc:'50% more effective',cost:50,icon:'🌾',bg:'#FFF3C0'},{id:'water',name:'Auto-Waterer',desc:'Passive thirst reduction',cost:75,icon:'💧',bg:'#D8EEF4'},{id:'coop',name:'Deluxe Coop',desc:'+10% health',cost:150,icon:'🏠',bg:'#F0E0CC'},{id:'flock4',name:'Expand Flock',desc:'Add 4th chicken',cost:200,icon:'🐔',bg:'#FDDEDE'}];

let G=load();
function dflt(){USED.clear();return{eggs:0,feed:10,coins:0,ti:0,ut:[],upgrades:{},cks:[{n:pick(),h:100,hu:25,th:20,et:10,ld:0},{n:pick(),h:100,hu:20,th:30,et:50,ld:0},{n:pick(),h:100,hu:30,th:15,et:75,ld:0}]};}
function pick(){const a=NAMES.filter(n=>!USED.has(n));return a.length?a[Math.floor(Math.random()*a.length)]:'Chicky';}
function load(){try{const s=JSON.parse(localStorage.getItem('yff-phaser'));if(s){s.cks.forEach(c=>USED.add(c.n));s.upgrades=s.upgrades||{};return s;}}catch(e){}return dflt();}
function save(){localStorage.setItem('yff-phaser',JSON.stringify(G));}
function resetGame(){G=dflt();save();location.reload();}
function tick(n){for(const c of G.cks){if(c.h<=0)continue;c.hu=Math.min(100,c.hu+n*2);c.th=Math.min(100,c.th+n*(G.upgrades.water?1.5:3));if(c.hu>=80||c.th>=80)c.h=Math.max(0,c.h-n*2);c.et=Math.min(100,c.et+n*3);}}
function feedAll(){if(G.feed<=0)return toast('Out of feed!','warn');const al=G.cks.filter(c=>c.h>0);if(!al.length)return toast('No chickens','warn');const n=Math.min(G.feed,al.length);G.feed-=n;al.slice(0,n).forEach(c=>{c.hu=Math.max(0,c.hu-(G.upgrades.feed?45:30));if(c.hu<30&&c.h<100)c.h=Math.min(100,c.h+3);});tick(3);save();updateUI();ntip();toast('Fed!','ok');}
function waterAll(){const al=G.cks.filter(c=>c.h>0);if(!al.length)return toast('No chickens','warn');al.forEach(c=>{c.th=Math.max(0,c.th-35);if(c.th<30&&c.h<100)c.h=Math.min(100,c.h+3);});tick(3);save();updateUI();ntip();toast('Watered!','ok');}
function collAll(){const rd=G.cks.filter(c=>c.h>0&&c.et>=80);if(!rd.length)return toast('No eggs ready','warn');rd.forEach(c=>{c.et=0;c.ld++;G.eggs++;G.coins+=10;});tick(3);save();updateUI();ntip();spawnConfetti();toast('Collected '+rd.length+' eggs!','ok');}
function buyFeed(){if(G.coins<5)return toast('Need 5 coins','warn');G.coins-=5;G.feed+=10;save();updateUI();toast('+10 scoops!','ok');}
function ntip(){const av=TIPS.map((_,i)=>i).filter(i=>!G.ut.includes(i));if(!av.length){G.ut=[];return ntip();}G.ti=av[Math.floor(Math.random()*av.length)];G.ut.push(G.ti);}
function toast(m,t){const c=document.getElementById('toastContainer');const e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;c.appendChild(e);setTimeout(()=>e.remove(),2400);}
function openStore(){const old=document.querySelector('.store-overlay');if(old)old.remove();const ov=document.createElement('div');ov.className='store-overlay';const available=UPGRADES.filter(u=>!G.upgrades[u.id]);const owned=UPGRADES.filter(u=>G.upgrades[u.id]);ov.innerHTML='<div class="store-modal" onclick="event.stopPropagation()"><button class="store-close" onclick="closeStore()">&times;</button><h2>Farm Store</h2><div class="store-coins">You have <strong>'+G.coins+' coins</strong></div><div class="store-grid">'+available.map(u=>'<div class="store-item"><div class="store-icon" style="background:'+u.bg+'">'+u.icon+'</div><div class="store-info"><div class="sin">'+u.name+'</div><div class="sid">'+u.desc+'</div></div><button class="store-buy" onclick="buyUpgrade(''+u.id+'')" '+(G.coins<u.cost?'disabled':'')+'>'+u.cost+' coins</button></div>').join('')+owned.map(u=>'<div class="store-item owned"><div class="store-icon" style="background:'+u.bg+'">✅</div><div class="store-info"><div class="sin">'+u.name+'</div><div class="sid">Purchased</div></div></div>').join('')+'</div></div>';ov.onclick=closeStore;document.body.appendChild(ov);}
function closeStore(){const o=document.querySelector('.store-overlay');if(o)o.remove();}
function buyUpgrade(id){const u=UPGRADES.find(x=>x.id===id);if(!u||G.coins<u.cost||G.upgrades[id])return;G.coins-=u.cost;G.upgrades[id]=true;if(id==='flock4')G.cks.push({n:pick(),h:100,hu:20,th:20,et:0,ld:0});save();updateUI();recreateChickens();closeStore();toast('Purchased!','ok');}
function updateUI(){const al=G.cks.filter(c=>c.h>0);document.getElementById('hEggs').textContent=G.eggs;document.getElementById('hCoins').textContent=G.coins;document.getElementById('hFeed').textContent=G.feed;const hf=G.feed>0,ha=al.length>0,ae=al.some(c=>c.et>=80);document.getElementById('actionBar').innerHTML='<button class="abtn feed" onclick="feedAll()" '+(hf&&ha?'':'disabled')+'>Feed All</button><button class="abtn water" onclick="waterAll()" '+(ha?'':'disabled')+'>Water All</button><button class="abtn collect" onclick="collAll()" '+(ae?'':'disabled')+'>Collect All</button><button class="abtn shop" onclick="buyFeed()">Buy Feed (5)</button><button class="abtn store-b" onclick="openStore()">Upgrades</button>';const tip=TIPS[G.ti%TIPS.length];document.getElementById('tipTitle').textContent=tip.t;document.getElementById('tipBody').textContent=tip.b;document.getElementById('tipAction').textContent=tip.a;}

// PHASER GAME
let gameScene,chickens=[],coopGfx,nestGfx,waterGfx,troughGfx;
(function initGame(){
if(!document.getElementById('game-canvas')){setTimeout(initGame,50);return;}
new Phaser.Game({type:Phaser.AUTO,width:920,height:520,parent:'game-canvas',backgroundColor:'#C5E3F0',scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_HORIZONTALLY},
scene:{preload:function(){Object.entries(SPRITES).forEach(function(e){this.textures.addBase64(e[0],e[1]);},this);},
create:function(){gameScene=this;var g=this.add.graphics();g.fillGradientStyle(0xC5E3F0,0xC5E3F0,0xE5F2F8,0xE5F2F8);g.fillRect(0,0,920,180);g=this.add.graphics();g.fillStyle(0xFFF3C0);g.fillCircle(810,40,28);g.fillStyle(0xFFE8A0);g.fillCircle(810,40,20);var ac=function(x,y,s){var c=this.add.graphics();c.fillStyle(0xFFFFFF,0.8);c.fillEllipse(x,y,72*s,28*s);c.fillCircle(x-18*s,y-4*s,16*s);c.fillCircle(x+10*s,y-8*s,19*s);c.fillCircle(x+26*s,y-1*s,14*s);}.bind(this);ac(100,35,1);ac(340,25,0.8);ac(580,40,0.9);g=this.add.graphics();g.fillGradientStyle(0xAED8B8,0xAED8B8,0x8CC09A,0x8CC09A);g.fillRect(0,160,920,360);g=this.add.graphics();g.lineStyle(2.5,0xC8A878);g.lineBetween(35,186,885,186);for(var x=40;x<900;x+=95){g.fillStyle(0xD4B896);g.fillRoundedRect(x-5,175,10,24,3);}var bush=function(x,y,s){var b=this.add.graphics();b.fillStyle(0x7BA860);b.fillCircle(x-10*s,y-2*s,12*s);b.fillStyle(0x8CB870);b.fillCircle(x+10*s,y-2*s,12*s);b.fillStyle(0x9CC880);b.fillCircle(x,y-12*s,14*s);}.bind(this);bush(870,220,1.1);bush(50,200,0.9);coopGfx=this.add.graphics();drawCoop();nestGfx=this.add.graphics();drawNests();waterGfx=this.add.graphics();drawWaterer();troughGfx=this.add.graphics();drawTrough();createChickens();updateUI();},update:function(){}}});
})();

function drawCoop(){coopGfx.clear();var h=G.upgrades.coop,cw=h?310:280,ch=h?135:120,crx=h?155:140,cx=35,cy=195;coopGfx.fillStyle(0xF0E0CC);coopGfx.lineStyle(3.5,0x4A3028);coopGfx.fillRoundedRect(cx,cy+30,cw,ch,6);coopGfx.strokeRoundedRect(cx,cy+30,cw,ch,6);coopGfx.fillStyle(h?0xE8A090:0xD4907A);coopGfx.fillTriangle(cx-10,cy+30,cx+crx,cy-14,cx+cw+10,cy+30);coopGfx.strokeTriangle(cx-10,cy+30,cx+crx,cy-14,cx+cw+10,cy+30);coopGfx.fillStyle(0x8B5E3C);coopGfx.fillRoundedRect(h?cx+cw-80:cx+200,cy+60,52,74,26);coopGfx.strokeRoundedRect(h?cx+cw-80:cx+200,cy+60,52,74,26);}
function drawNests(){nestGfx.clear();nestGfx.fillStyle(0xF0E0C0,0.5);nestGfx.fillEllipse(120,358,164,30);G.cks.forEach(function(c,i){if(c.h<=0)return;var bx=62+i*54;nestGfx.fillStyle(0xF0E0CC);nestGfx.lineStyle(3,0x4A3028);nestGfx.fillRoundedRect(bx,340,46,38,4);nestGfx.strokeRoundedRect(bx,340,46,38,4);if(c.et>=80){nestGfx.fillStyle(0xFDF8F0);nestGfx.lineStyle(2.5,0x4A3028);nestGfx.fillEllipse(bx+23,356,16,20);nestGfx.strokeEllipse(bx+23,356,16,20);}});}
function drawWaterer(){waterGfx.clear();waterGfx.fillStyle(0xB8DCE8);waterGfx.lineStyle(3,0x4A3028);waterGfx.fillEllipse(272,387,44,18);waterGfx.fillStyle(0xD8EEF4);waterGfx.fillRect(258,368,28,19);waterGfx.strokeEllipse(272,387,44,18);}
function drawTrough(){troughGfx.clear();troughGfx.fillStyle(0xF0E0CC);troughGfx.lineStyle(3.5,0x4A3028);troughGfx.fillRoundedRect(380,448,160,24,6);troughGfx.strokeRoundedRect(380,448,160,24,6);troughGfx.fillStyle(G.upgrades.feed?0xF8E8C0:0xF0E0B0);troughGfx.fillRoundedRect(385,451,150,13,4);}
function createChickens(){chickens.forEach(function(c){c.sprite.destroy();c.dot.destroy();c.name.destroy();});chickens=[];var al=G.cks.filter(function(c){return c.h>0;});var pos=getPositions(al.length);al.forEach(function(c,i){var p=pos[i];var key='idle1';if(i===1)key='peck';else if(i===2)key='lookup';var sprite=gameScene.add.image(p.x,p.y,key);sprite.setScale(0.65);sprite.setInteractive();sprite.on('pointerdown',function(){collectEgg(c);});var dc=0x8CC09A;if(c.h<30||c.hu>=80||c.th>=80)dc=0xE57373;else if(c.h<60||c.hu>=50||c.th>=50)dc=0xF4B840;var dot=gameScene.add.circle(p.x,p.y-55,6,dc);dot.setStrokeStyle(2,0x4A3028);var nm=gameScene.add.text(p.x,p.y-75,c.n,{fontFamily:'Nunito',fontSize:'10px',fontWeight:'700',color:'#4A3028',backgroundColor:'rgba(255,255,255,0.9)',padding:{x:6,y:2}}).setOrigin(0.5);gameScene.tweens.add({targets:sprite,y:p.y-(i===1?5:3),duration:1200+i*400,yoyo:true,repeat:-1,ease:'Sine.easeInOut'});chickens.push({sprite:sprite,dot:dot,name:nm,chicken:c});});}
function recreateChickens(){createChickens();drawNests();}
function getPositions(n){if(n<=3)return[{x:360,y:380},{x:540,y:370},{x:720,y:385}];if(n===4)return[{x:300,y:380},{x:450,y:370},{x:600,y:385},{x:750,y:375}];return[{x:260,y:380},{x:390,y:370},{x:520,y:385},{x:650,y:375},{x:780,y:380}];}
function collectEgg(c){if(c.h<=0)return toast(c.n+' is gone','warn');if(c.et<80)return toast(c.n+" isn't ready",'warn');c.et=0;c.ld++;G.eggs++;G.coins+=10;tick(2);save();updateUI();ntip();drawNests();spawnConfetti();toast('+1 egg, +10 coins!','ok');}
function spawnConfetti(){var colors=[0xE57373,0xF4B840,0x8CC09A,0x8EC8D8,0xF0A0A0];for(var i=0;i<30;i++){(function(){var p=gameScene.add.circle(540,400,3+Math.random()*5,colors[Math.floor(Math.random()*colors.length)]);gameScene.tweens.add({targets:p,x:540+(Math.random()-0.5)*300,y:400-Math.random()*200,alpha:0,scale:0.2,duration:800+Math.random()*400,ease:'Cubic.easeOut',onComplete:function(){p.destroy();}});})();}}
</script>
</body>
</html>
