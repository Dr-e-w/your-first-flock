<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your First Flock — Chicken Care Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8F4E8;--sky:#C5E3F0;--grass:#AED8B8;--wood:#E8D5C0;--wood-dk:#C4A080;--roof:#D4907A;--salmon:#E57373;--gold:#F4B840;--text:#4A3028;--text-muted:#8B7060;--outline:#4A3028;--fd:"Baloo 2",cursive;--fb:"Nunito",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fb);background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;background-image:radial-gradient(ellipse at 20% 20%,rgba(240,160,160,0.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(142,200,216,0.06) 0%,transparent 50%)}
.app{width:100%;max-width:960px;display:flex;flex-direction:column;min-height:100vh}

/* Wooden frame header */
.header-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:linear-gradient(180deg,#F0E0CC 0%,#E0CCB0 100%);border-bottom:5px solid #8B6F4E;border-left:5px solid #C4A080;border-right:5px solid #A08060;position:sticky;top:0;z-index:50;gap:10px;flex-wrap:wrap;box-shadow:0 4px 0 rgba(0,0,0,0.08)}
.logo-text{font-family:var(--fd);font-weight:800;font-size:1.5rem;color:var(--text);letter-spacing:-0.3px;text-shadow:1px 1px 0 rgba(255,255,255,0.5)}
.logo-text .accent{color:var(--salmon)}
.header-stats{display:flex;gap:10px;align-items:center}
.stat-pill{display:flex;align-items:center;gap:6px;font-weight:700;font-size:0.88rem;color:var(--text);background:white;padding:6px 14px;border-radius:20px;border:2.5px solid var(--outline);box-shadow:inset 0 2px 0 rgba(255,255,255,0.8),0 2px 0 rgba(0,0,0,0.08)}
.stat-pill .sp-val{font-family:var(--fd);font-size:1.15rem}
.coin-pill{font-weight:700;font-size:0.88rem;color:var(--text);background:linear-gradient(135deg,#FFF8D0,#FFE8A0);padding:6px 14px;border-radius:20px;border:2.5px solid var(--outline);box-shadow:inset 0 2px 0 rgba(255,255,255,0.8),0 2px 0 rgba(0,0,0,0.08)}
.coin-pill strong{font-family:var(--fd);font-size:1.15rem}
.feed-pill{font-weight:700;font-size:0.88rem;color:var(--text-muted);background:white;padding:6px 14px;border-radius:20px;border:2.5px solid var(--outline);box-shadow:inset 0 2px 0 rgba(255,255,255,0.8),0 2px 0 rgba(0,0,0,0.08)}
.feed-pill strong{color:var(--text);font-family:var(--fd);font-size:1.15rem}
.stat-pill svg,.coin-pill svg,.feed-pill svg{vertical-align:middle;flex-shrink:0}
.hdr-store{font-family:var(--fb);font-weight:700;font-size:0.82rem;color:white;background:linear-gradient(180deg,#8B6F4E,#6B5030);padding:7px 16px;border-radius:12px;border:2.5px solid #4A3028;cursor:pointer;box-shadow:0 3px 0 #4A3028,inset 0 1px 0 rgba(255,255,255,0.2);transition:all 0.1s}
.hdr-store:hover{transform:translateY(-1px);box-shadow:0 4px 0 #4A3028,inset 0 1px 0 rgba(255,255,255,0.2)}
.hdr-store:active{transform:translateY(2px);box-shadow:0 1px 0 #4A3028}

/* Scene */
.scene-wrap{margin:14px 20px 8px;position:relative}
.scene-wrap svg{display:block;width:100%;background:var(--sky);border-radius:18px;border:4px solid var(--outline);box-shadow:0 5px 0 var(--outline),0 8px 24px rgba(74,48,40,0.12)}
.clickable{cursor:pointer;transition:filter 0.15s}
.clickable:hover{filter:brightness(1.08)}
.clickable:active{filter:brightness(0.94)}

/* Popup */
.chicken-popup{position:absolute;background:white;border-radius:16px;padding:16px 20px;border:4px solid var(--outline);box-shadow:0 5px 0 var(--outline),0 8px 24px rgba(74,48,40,0.15);z-index:25;min-width:200px;pointer-events:auto;font-family:var(--fb)}
.chicken-popup .pn{font-family:var(--fd);font-weight:700;font-size:1.05rem;color:var(--text);margin-bottom:8px}
.chicken-popup .ps{display:flex;align-items:center;gap:8px;font-size:0.78rem;font-weight:700;color:var(--text-muted);margin-bottom:5px}
.chicken-popup .pb{flex:1;height:8px;background:#F0E8DD;border-radius:4px;border:2px solid var(--outline);overflow:hidden}
.chicken-popup .pbf{height:100%;border-radius:2px;transition:width 0.4s}
.pbf.h{background:#8CC09A}.pbf.g{background:var(--gold)}.pbf.t{background:#6BA8C8}
.chicken-popup .pa{display:flex;gap:6px;margin-top:10px}
.mini-btn{padding:7px 14px;border-radius:10px;border:3px solid var(--outline);background:white;font-family:var(--fb);font-size:0.74rem;font-weight:700;cursor:pointer;transition:all 0.1s;box-shadow:0 3px 0 var(--outline),inset 0 1px 0 rgba(255,255,255,0.6)}
.mini-btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--outline),inset 0 1px 0 rgba(255,255,255,0.6)}
.mini-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--outline)}
.mini-btn.accent{background:#F0A0A0;color:white}
.close-p{position:absolute;top:8px;right:12px;background:none;border:none;font-size:1.3rem;cursor:pointer;color:var(--text-muted);font-family:var(--fb);font-weight:700}

/* Store Modal */
.store-overlay{position:fixed;inset:0;background:rgba(74,48,40,0.45);z-index:80;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.store-modal{background:white;border-radius:18px;border:5px solid var(--outline);box-shadow:0 8px 0 var(--outline),0 12px 40px rgba(74,48,40,0.25);padding:28px;max-width:580px;width:90%;max-height:85vh;overflow-y:auto;position:relative;font-family:var(--fb)}
.store-modal h2{font-family:var(--fd);font-size:1.5rem;margin-bottom:4px;text-align:center}
.store-coins{text-align:center;font-weight:700;color:var(--text-muted);margin-bottom:18px;font-size:0.95rem}
.store-coins strong{color:#C4902A;font-family:var(--fd);font-size:1.2rem}
.store-grid{display:flex;flex-direction:column;gap:10px}
.store-item{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;border:3px solid var(--outline);background:#FFFAF5;box-shadow:0 3px 0 var(--outline),inset 0 1px 0 rgba(255,255,255,0.8);transition:all 0.15s}
.store-item:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--outline),inset 0 1px 0 rgba(255,255,255,0.8)}
.store-item.owned{opacity:0.55;pointer-events:none}
.store-icon{width:52px;height:52px;border-radius:12px;border:3px solid var(--outline);display:flex;align-items:center;justify-content:center;font-size:1.6rem;flex-shrink:0}
.store-info{flex:1}
.store-info .sin{font-family:var(--fd);font-weight:700;font-size:0.92rem;color:var(--text)}
.store-info .sid{font-size:0.74rem;color:var(--text-muted);margin-top:2px;font-weight:600}
.store-buy{padding:8px 18px;border-radius:10px;border:3px solid var(--outline);font-family:var(--fb);font-size:0.78rem;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--outline),inset 0 1px 0 rgba(255,255,255,0.6);transition:all 0.1s;white-space:nowrap;background:white}
.store-buy:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--outline),inset 0 1px 0 rgba(255,255,255,0.6)}
.store-buy:active{transform:translateY(2px);box-shadow:0 1px 0 var(--outline)}
.store-buy:disabled{opacity:0.4;cursor:not-allowed;transform:none}
.store-close{position:absolute;top:12px;right:16px;background:none;border:none;font-size:1.5rem;cursor:pointer;color:var(--text-muted);font-family:var(--fb);font-weight:700}

/* Action Bar — glossy 3D buttons */
.action-bar{display:flex;gap:10px;padding:0 20px;flex-wrap:wrap;justify-content:center}
.abtn{padding:14px 22px;border-radius:14px;border:3px solid var(--outline);font-size:0.88rem;font-weight:700;cursor:pointer;transition:all 0.1s;box-shadow:0 4px 0 var(--outline),inset 0 2px 0 rgba(255,255,255,0.4);display:flex;align-items:center;gap:7px;user-select:none;font-family:var(--fb);color:white}
.abtn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--outline),inset 0 2px 0 rgba(255,255,255,0.4)}
.abtn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--outline)}
.abtn:disabled{opacity:0.35;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--outline),inset 0 2px 0 rgba(255,255,255,0.4)}
.abtn.feed{background:linear-gradient(180deg,#F8C860 0%,#E8A830 100%)}
.abtn.water{background:linear-gradient(180deg,#8CC8E0 0%,#4A98B8 100%)}
.abtn.collect{background:linear-gradient(180deg,#F09090 0%,#D46060 100%)}
.abtn.shop{background:linear-gradient(180deg,#A0D0A0 0%,#60A060 100%)}
.abtn.store-b{background:linear-gradient(180deg,#D4A040 0%,#B08020 100%)}

/* Tip Card */
.tip-card{margin:12px 20px 20px;background:white;border-radius:16px;padding:18px 22px;border:4px solid var(--outline);box-shadow:0 4px 0 var(--outline),0 5px 16px rgba(74,48,40,0.06);position:relative}
.tip-card .tbadge{display:inline-block;background:var(--gold);color:white;font-weight:800;font-size:0.68rem;padding:4px 10px;border-radius:18px;border:2.5px solid var(--outline);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;font-family:var(--fb);box-shadow:inset 0 1px 0 rgba(255,255,255,0.4)}
.tip-card .ttitle{font-family:var(--fd);font-weight:700;font-size:1.05rem;color:var(--text);margin-bottom:4px}
.tip-card .tbody{font-size:0.85rem;color:var(--text-muted);line-height:1.5;font-weight:600;font-family:var(--fb)}
.tip-card .taction{display:inline-block;margin-top:8px;font-size:0.8rem;color:var(--salmon);font-weight:700;font-family:var(--fb)}

/* Toast */
.toast-container{position:fixed;top:90px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#4A3028;color:white;padding:10px 22px;border-radius:22px;font-weight:700;font-size:0.85rem;text-align:center;border:3px solid var(--outline);box-shadow:0 4px 0 var(--outline),inset 0 1px 0 rgba(255,255,255,0.2);animation:tin 0.3s ease-out,tout 0.25s 2s ease-in forwards;pointer-events:auto;font-family:var(--fb)}
.toast.warn{background:var(--salmon)}.toast.ok{background:#8CC09A}
@keyframes tin{0%{opacity:0;transform:translateY(-14px)}100%{opacity:1;transform:translateY(0)}}
@keyframes tout{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-14px)}}
.rst-area{text-align:center;padding:6px 20px 24px}
.rst-area button{background:none;border:none;color:var(--text-muted);font-family:var(--fb);font-size:0.76rem;font-weight:700;cursor:pointer;text-decoration:underline}
.rst-area button:hover{color:var(--salmon)}

/* Effects */
@keyframes confPop{0%{transform:translate(0,0) scale(1);opacity:1}60%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0.3);opacity:0}}
.confetti-piece{animation:confPop 0.9s ease-out forwards;animation-delay:var(--delay);pointer-events:none}
@keyframes coinFly{0%{transform:translate(0,0) scale(1);opacity:1}70%{opacity:1}100%{transform:translate(var(--cx),var(--cy)) scale(0.4);opacity:0}}
.coin-particle{animation:coinFly 0.8s ease-in forwards;animation-delay:var(--cd);pointer-events:none}
@keyframes plusCoin{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-40px)}}
.plus-coin{animation:plusCoin 1.4s ease-out forwards;pointer-events:none}

/* Chicken anims */
@keyframes bob{0%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}
@keyframes peck{0%,100%{transform:translateY(0) rotate(0deg)}35%{transform:translateY(4px) rotate(-3deg)}70%{transform:translateY(0) rotate(2deg)}}
@keyframes tilt{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.anim-b{animation:bob 2.4s ease-in-out infinite}
.anim-p{animation:peck 1.1s ease-in-out infinite}
.anim-t{animation:tilt 3s ease-in-out infinite}
</style>
</head>
<body>

<header class="header-bar">
<div><span class="logo-text">Your First <span class="accent">Flock</span></span></div>
<div class="header-stats">
<div class="stat-pill"><svg width="18" height="20" viewBox="0 0 18 20"><ellipse cx="9" cy="11" rx="8" ry="10" fill="#FDF8F0" stroke="#4A3028" stroke-width="2"/><ellipse cx="9" cy="9" rx="5" ry="6" fill="white" opacity="0.5"/></svg> <span class="sp-val" id="hEggs">0</span></div>
<div class="coin-pill"><svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#F4B840" stroke="#4A3028" stroke-width="2"/><text x="10" y="14" text-anchor="middle" font-size="10" fill="#4A3028" font-weight="700">¢</text></svg> <strong id="hCoins">0</strong></div>
<div class="feed-pill"><svg width="20" height="20" viewBox="0 0 20 20"><line x1="10" y1="2" x2="10" y2="14" stroke="#7BA860" stroke-width="2.5"/><ellipse cx="10" cy="4" rx="2" ry="3" fill="#C4A878"/><line x1="10" y1="8" x2="5" y2="12" stroke="#7BA860" stroke-width="1.5"/><line x1="10" y1="10" x2="15" y2="13" stroke="#7BA860" stroke-width="1.5"/><rect x="4" y="16" width="12" height="3" rx="1.5" fill="#C4A878" stroke="#4A3028" stroke-width="1"/></svg> <strong id="hFeed">10</strong></div>
</div>
<button class="hdr-store" onclick="openStore()"><svg width="16" height="16" viewBox="0 0 16 16" style="vertical-align:middle;margin-right:4px"><rect x="2" y="6" width="12" height="8" rx="1.5" fill="none" stroke="white" stroke-width="1.5"/><circle cx="6" cy="14" r="1.5" fill="white"/><circle cx="11" cy="14" r="1.5" fill="white"/><line x1="5" y1="3" x2="8" y2="6" stroke="white" stroke-width="1.5"/><line x1="11" y1="3" x2="8" y2="6" stroke="white" stroke-width="1.5"/></svg>Store</button>
</header>
<div class="scene-wrap" id="sceneWrap"><svg viewBox="0 0 920 520" id="sceneSvg"></svg></div>
<div class="action-bar" id="actionBar"></div>
<div class="tip-card" id="tipCard"><div class="tbadge">🐣 Chicken Knowledge</div><div class="ttitle" id="tipTitle"></div><div class="tbody" id="tipBody"></div><div class="taction" id="tipAction"></div></div>
<div class="rst-area"><button onclick="resetGame()">Reset flock & start over</button></div>
</div>
<div class="toast-container" id="toastContainer"></div>

// ═══════════════ STATE ═══════════════
const NAMES=['Henrietta','Nugget','Cluckles','Eggwina','Pecky','Sunny','Daisy','Maple','Buttercup','Ginger'];
const USED=new Set();
const TIPS=[{t:'Eggshells Are Mostly Calcium',b:'A single eggshell contains about 2 grams of calcium. Without enough dietary calcium, hens produce thin-shelled or shell-less eggs.',a:'💡 Supplement: crushed oyster shells or limestone grit.'},{t:'Chickens Need Grit to Digest',b:'Chickens don\'t have teeth. They swallow small stones that sit in their gizzard, grinding food like a natural mill.',a:'💡 Provide coarse sand or commercial poultry grit.'},{t:'A Hen Lays Every 24–26 Hours',b:'It takes about 25 hours for a hen to form an egg. They lay slightly later each day, eventually skipping a day.',a:'💡 Expect 5–6 eggs per hen per week, not one daily.'},{t:'Fresh Water > Food',b:'A chicken can survive weeks without food but only days without water. A laying hen drinks about 2 cups per day.',a:'💡 Check waterers twice daily. Ice cubes in summer.'},{t:'The Comb Reveals Health',b:'A bright red, plump comb means a healthy, laying hen. Pale or shrunken combs signal illness or mites.',a:'💡 Quick comb check every time you collect eggs.'},{t:'Dust Baths, Not Water Baths',b:'Chickens clean themselves by fluffing dry dirt through their feathers — it smothers parasites and absorbs oil.',a:'💡 Provide dry dirt, sand, and a little wood ash.'},{t:'Egg Color = Breed',b:'White earlobes usually mean white eggs. Red earlobes usually mean brown eggs. Some breeds lay blue or green.',a:'💡 Ameraucana and Cream Legbar lay blue eggs.'},{t:'Overfeeding Is Common',b:'Obesity leads to fatty liver syndrome, egg-binding, and reduced laying. Most backyard flocks are overfed.',a:'💡 About ¼ lb of feed per hen per day. Limit treats.'},{t:'Chickens Recognize Faces',b:'Chickens recognize up to 100 faces, including humans. They form social hierarchies that last for months.',a:'💡 Spend time near your flock daily — they\'ll trust you.'},{t:'The Bloom Protects Eggs',b:'Fresh eggs have a natural coating called the "bloom" that seals the pores. Unwashed eggs last weeks at room temp.',a:'💡 Only wash eggs right before use, then refrigerate.'},{t:'Body Temp: 105–107°F',b:'That high metabolism means they need constant food and water. Extra feed before bedtime helps in cold weather.',a:'💡 Scratch grains or corn before bed on cold nights.'},{t:'Molting = No Eggs',b:'Once a year, hens shed and regrow feathers for 8–16 weeks. They stop laying entirely during molt.',a:'💡 Switch to higher-protein feed (18–20%) during molt.'},{t:'Predators Come From All Sides',b:'Hawks, raccoons, foxes, and weasels are top threats. A weasel can squeeze through a 1-inch gap.',a:'💡 Use ½-inch hardware cloth, buried 12 inches deep.'},{t:'Yolk Color = Diet',b:'Deep orange yolks come from carotenoids in marigolds, alfalfa, and leafy greens. Pale yolks = grain-only diet.',a:'💡 Free-range access to grass and bugs for rich yolks.'},{t:'Descendants of Dinosaurs',b:'Chickens descend from the Red Junglefowl. T. rex is closer to chickens than to Stegosaurus.',a:'💡 Your flock carries 150 million years of lineage.'}];
const UPGRADES=[{id:'feed',name:'Premium Feed',desc:'50% more effective — fills chickens up faster',cost:50,icon:'🌾',bg:'#FFF3C0'},{id:'water',name:'Auto-Waterer',desc:'Passive 5% thirst reduction each tick',cost:75,icon:'💧',bg:'#D8EEF4'},{id:'coop',name:'Deluxe Coop',desc:'+10% health buffer — prettier, sturdier coop',cost:150,icon:'🏠',bg:'#F0E0CC'},{id:'flock4',name:'Expand Flock',desc:'Add a 4th chicken to your flock',cost:200,icon:'🐔',bg:'#FDDEDE'},{id:'flock5',name:'Big Flock',desc:'Add a 5th chicken (requires Expand Flock)',cost:350,icon:'🐔',bg:'#FDDEDE'},{id:'flock6',name:'Mega Flock',desc:'Add a 6th chicken (requires Mega Flock)',cost:500,icon:'🐔',bg:'#FDDEDE'}];

let G=load();
function dflt(){USED.clear();return{eggs:0,feed:10,coins:0,ti:0,ut:[],sel:null,upgrades:{},cks:[{n:pick(),h:100,hu:25,th:20,et:10,ld:0},{n:pick(),h:100,hu:20,th:30,et:50,ld:0},{n:pick(),h:100,hu:30,th:15,et:75,ld:0}]};}
function pick(){const a=NAMES.filter(n=>!USED.has(n));return a.length?a[Math.floor(Math.random()*a.length)]:'Chicky';}
function load(){try{const s=JSON.parse(localStorage.getItem('yff-v9'));if(s){s.cks.forEach(c=>USED.add(c.n));s.upgrades=s.upgrades||{};return s;}}catch(e){}return dflt();}
function save(){localStorage.setItem('yff-v9',JSON.stringify(G));}
function resetGame(){G=dflt();save();renderAll();closeStore();toast('Fresh flock! 🐣','ok');}

function tick(n){for(const c of G.cks){if(c.h<=0)continue;c.hu=Math.min(100,c.hu+n*2);c.th=Math.min(100,c.th+n*(G.upgrades.water?1.5:3));if(c.hu>=80||c.th>=80)c.h=Math.max(0,c.h-n*2);c.et=Math.min(100,c.et+n*3);}}
function feed1(i){const c=G.cks[i];if(c.h<=0)return toast(c.n+' is gone 😢','warn');if(G.feed<=0)return toast('Out of feed!','warn');G.feed--;const mul=G.upgrades.feed?1.5:1;c.hu=Math.max(0,c.hu-35*mul);if(c.hu<30&&c.h<100&&c.th<80)c.h=Math.min(100,c.h+3);tick(2);save();renderAll();ntip();toast('Fed '+c.n+'!','ok');}
function water1(i){const c=G.cks[i];if(c.h<=0)return toast(c.n+' is gone 😢','warn');c.th=Math.max(0,c.th-40);if(c.th<30&&c.h<100&&c.hu<80)c.h=Math.min(100,c.h+3);tick(2);save();renderAll();ntip();toast('Watered '+c.n+'!','ok');}
function egg1(i){const c=G.cks[i];if(c.h<=0)return toast(c.n+' is gone 😢','warn');if(c.et<80)return toast(c.n+' isn\'t ready ⏳','warn');c.et=0;c.ld++;G.eggs++;G.coins+=10;tick(2);save();renderAll();ntip();burstConfetti(i);flyCoins(i);toast('🥚 +1 egg, +10 🪙','ok');}
function feedAll(){if(G.feed<=0)return toast('Out of feed!','warn');const al=G.cks.filter(c=>c.h>0);if(!al.length)return toast('No chickens 😢','warn');const n=Math.min(G.feed,al.length);G.feed-=n;const mul=G.upgrades.feed?1.5:1;al.slice(0,n).forEach(c=>{c.hu=Math.max(0,c.hu-30*mul);if(c.hu<30&&c.h<100)c.h=Math.min(100,c.h+3);});tick(3);save();renderAll();ntip();toast('Fed '+n+' chicken(s)!','ok');}

// Sprite cycling animation
let spriteCycles={};
const CYCLE_FRAMES=[['idle1','walk','idle2','idle1'],['peck','idle2','peck','idle1'],['lookup','idle1','lookup','idle2']];
function startSpriteCycle(chickenIdx,cycleIdx){
  const key='ck'+chickenIdx;
  spriteCycles[key]={idx:0,frames:CYCLE_FRAMES[cycleIdx%3]};
}
function getCycledSprite(chickenIdx,animClass){
  // Static fallback
  if(animClass==='anim-p')return SPRITES.peck;
  if(animClass==='anim-t')return SPRITES.lookup;
  // Cycle if available
  const key='ck'+chickenIdx;
  if(spriteCycles[key]){
    return SPRITES[spriteCycles[key].frames[spriteCycles[key].idx]];
  }
  return SPRITES.idle1;
}
// Advance all cycles every 600ms
setInterval(function(){
  Object.keys(spriteCycles).forEach(function(k){
    const c=spriteCycles[k];
    c.idx=(c.idx+1)%c.frames.length;
  });
},600);

function drawChicken(c,dotColor,animClass,chickenIdx){
  let sprite=getCycledSprite(chickenIdx,animClass);
  const g=E('g',{class:'chicken-g '+animClass});
  g.appendChild(E('ellipse',{cx:2,cy:36,rx:32,ry:9,fill:'rgba(74,48,40,0.18)'}));
  g.appendChild(E('image',{x:-38,y:-62,width:76,height:105,href:sprite}));
  g.appendChild(E('circle',{cx:2,cy:-68,r:7,fill:dotColor,...OL,'stroke-width':'2.5'}));
  return g;
}

}

function renderAll(){
  const al=G.cks.filter(c=>c.h>0);
  document.getElementById('hEggs').textContent=G.eggs;
  document.getElementById('hCoins').textContent=G.coins;
  document.getElementById('hFeed').textContent=G.feed;
  renderScene();
  const hf=G.feed>0,ha=al.length>0,ae=al.some(c=>c.et>=80);
  document.getElementById('actionBar').innerHTML=`<button class="abtn feed" onclick="feedAll()" ${!hf||!ha?'disabled':''}>🍽️ Feed All</button><button class="abtn water" onclick="waterAll()" ${!ha?'disabled':''}>💧 Water All</button><button class="abtn collect" onclick="collAll()" ${!ae?'disabled':''}>🥚 Collect All</button><button class="abtn shop" onclick="buyFeed()">🪙 Buy Feed (5)</button><button class="abtn store-b" onclick="openStore()">🛒 Upgrades</button>`;
  const tip=TIPS[G.ti%TIPS.length];
  document.getElementById('tipTitle').textContent=tip.t;
  document.getElementById('tipBody').textContent=tip.b;
  document.getElementById('tipAction').textContent=tip.a;
}

renderAll();
setInterval(()=>{tick(1);save();renderAll();},25000);
</script>
</body>
</html>
